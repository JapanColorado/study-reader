[workspace]
name = "study-reader"
version = "0.1.0"
description = "PDF/EPUB reader with per-snippet Claude chats sharing the book as context"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
pyside6 = ">=6.7"
pymupdf = ">=1.24"
claude-agent-sdk = "*"
pytest = "*"
numpy = ">=2.5.3, <3"
readability-lxml = ">=0.9, <0.10"
lxml = ">=6.1.3, <7"
fsrs = ">=6.3, <7"
# The FSRS optimizer ("Optimize parameters"); CPU-only torch keeps the download small.
torch = { version = ">=2.5", index = "https://download.pytorch.org/whl/cpu" }
pandas = ">=2.2"
tqdm = "*"
# Read aloud: Kokoro neural TTS (on the CPU torch above), misaki's G2P, and spaCy's
# English model, so misaki never tries to pip-install it at runtime.
kokoro = ">=0.9.4, <0.10"
misaki = { version = ">=0.9.4", extras = ["en"] }
soundfile = ">=0.13"  # reads the Opus audio rendered on Colab
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"

[tasks]
app = "python -m study_reader"
test = "pytest -q tests"
# Live check of priming + forking; makes real Claude requests.
check-claude = "python scripts/check_forking.py"
install-desktop = "install -Dm644 study-reader.desktop ~/.local/share/applications/study-reader.desktop && install -Dm644 src/study_reader/assets/icon.svg ~/.local/share/icons/hicolor/scalable/apps/study-reader.svg"
