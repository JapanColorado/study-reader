<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="quiz.css">
<script src="katex/katex.min.js"></script>
<script src="markdown-it.min.js"></script>
<script src="markdown.js"></script>
<script src="mathlive/mathlive.min.js"></script>
<script src="mathfield.js"></script>
<script src="quiz.js"></script>
<script src="vizfit.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<style>
  /* Fallbacks; the app sets these from theme.py on every render. */
  :root { --surface:#fbfaf8; --fg:#1f1e1c; --muted:#6b6862; --faint:#a19d95; --user:#efece6; --border:#dedad2;
          --accent:#b8562f; --accent-soft:#f4e2d8; --code:#f1eee8; --error:#c0392b; --scroll:#cfcac1;
          --raised:#ffffff; --success:#3a8f5c; --warning:#b8860b; }
  html, body { margin:0; background:var(--surface); color:var(--fg); font:14.5px/1.6 system-ui, sans-serif; }
  ::selection { background:var(--accent-soft); }
  ::-webkit-scrollbar { width:11px; height:11px; }
  ::-webkit-scrollbar-thumb { background:var(--scroll); border-radius:3px; border:3px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background-color:var(--faint); }
  #log { padding:14px 12px 28px; }
  .empty { color:var(--muted); text-align:center; margin:56px auto 0; max-width:260px; line-height:1.5; }
  .empty svg { display:block; margin:0 auto 12px; width:36px; height:36px; stroke:var(--faint); }
  .msg { margin:0 0 18px; overflow-wrap:anywhere; }
  .msg.user { background:var(--user); border-radius:12px 12px 4px 12px; padding:10px 14px; margin-left:10%; }
  .msg.error { color:var(--error); border:1px solid var(--error); border-radius:10px; padding:8px 12px; font-size:13px; }
  .msg.assistant { padding:0 2px; }
  .msg p { margin:0.5em 0; }
  .msg > :first-child, .body > :first-child { margin-top:0; }
  .msg > :last-child, .body > :last-child { margin-bottom:0; }
  h1, h2, h3, h4 { line-height:1.3; margin:1em 0 0.4em; }
  h1 { font-size:1.3em; } h2 { font-size:1.18em; } h3 { font-size:1.06em; } h4 { font-size:1em; }
  ul, ol { padding-left:1.4em; } li { margin:0.2em 0; }
  hr { border:none; border-top:1px solid var(--border); margin:1em 0; }
  a { color:var(--accent); }
  a.snip { display:block; text-decoration:none; color:var(--muted); border-left:3px solid var(--accent);
           padding:2px 0 2px 10px; margin:0 0 10px; font-size:13px; cursor:pointer; border-radius:2px; }
  a.snip:hover { color:var(--fg); }
  a.snip .loc { display:block; font-size:11px; font-weight:600; color:var(--accent); margin-bottom:2px; }
  a.snip .quote { display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-wrap; }
  a.snip img { max-width:100%; max-height:220px; border:1px solid var(--border); border-radius:6px; display:block; }
  pre { background:var(--code); border:1px solid var(--border); padding:10px 12px; border-radius:8px; overflow-x:auto; }
  code { background:var(--code); padding:1px 5px; border-radius:4px; font-size:0.88em; font-family:ui-monospace, "JetBrains Mono", monospace; }
  pre code { padding:0; background:none; }
  table { border-collapse:collapse; margin:0.6em 0; } th, td { border:1px solid var(--border); padding:4px 9px; }
  th { background:var(--code); }
  blockquote { border-left:3px solid var(--border); margin:0.5em 0; padding-left:12px; color:var(--muted); }
  .katex-display { overflow-x:auto; overflow-y:hidden; padding:2px 0; }
  .viz { margin:0.7em 0; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--surface); }
  .viz-head { display:flex; align-items:center; gap:8px; padding:5px 6px 5px 11px; border-bottom:1px solid var(--border);
              background:var(--code); font-size:12px; color:var(--muted); }
  .viz-head .title { flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .viz-head a { color:var(--accent); text-decoration:none; padding:1px 7px; border-radius:5px; }
  .viz-head a:hover { background:var(--accent-soft); }
  .viz-frame { position:relative; height:160px; overflow:hidden; }
  .viz iframe { display:block; width:100%; height:160px; border:0; }
  .viz.pending { padding:14px 12px; color:var(--muted); font-size:13px; }
  .actions { display:flex; gap:2px; margin:-12px 0 14px; font-size:12px; }
  .actions.user { justify-content:flex-end; margin:-15px 0 4px; opacity:0; transition:opacity .12s; }
  .actions.reply { opacity:0; transition:opacity .12s; }
  .turn:hover .actions.user, .actions.user:focus-within, .turn:hover .actions.reply, .actions.reply:focus-within { opacity:1; }
  .actions a { display:inline-flex; align-items:center; gap:4px; color:var(--muted); text-decoration:none;
               padding:2px 7px; border-radius:6px; }
  .actions a:hover { color:var(--fg); background:var(--code); }
  .speaking { background:var(--accent-soft); border-radius:4px; box-shadow:0 0 0 3px var(--accent-soft); }
  .actions svg { width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .msg.user.editing { outline:2px solid var(--accent); outline-offset:1px; }
  .turn.stale { opacity:0.4; }
  .quiz { margin:0.7em 0; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .quiz.pending { padding:14px 12px; color:var(--muted); font-size:13px; }
  .quiz-head { display:flex; align-items:center; gap:8px; padding:6px 11px; border-bottom:1px solid var(--border);
               background:var(--code); font-size:12px; color:var(--muted); }
  .quiz-head .title { flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .quiz-broken { padding:10px 12px; color:var(--muted); font-size:13px; }
  .quiz-foot { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--code); font-size:13px; }
  .quiz-foot .score { flex:1; font-weight:600; }
  .quiz-head .deck { font:inherit; font-size:11px; padding:1px 7px; border-radius:5px; cursor:pointer; color:var(--muted);
                     background:transparent; border:1px solid var(--border); }
  .quiz-head .deck.on { color:var(--success); border-color:var(--success); }
  .quiz-head .deck:hover { background:var(--accent-soft); }
  .quiz-head .revise { font:inherit; font-size:11px; padding:1px 7px; border-radius:5px; cursor:pointer; color:var(--muted);
                       background:transparent; border:1px solid var(--border); }
  .quiz-head .revise:hover { background:var(--accent-soft); color:var(--accent); }
  .quiz-revised { padding:6px 12px; font-size:12.5px; color:var(--muted); border-bottom:1px solid var(--border); }
  .quiz-revised button { font:inherit; color:var(--accent); background:none; border:0; padding:0; cursor:pointer; }
  .quiz-revised button:hover { text-decoration:underline; }
  .quiz-revised ~ * { opacity:0.55; }
  .cursor::after { content:"▍"; color:var(--accent); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
</style>
</head>
<body>
<div id="log"></div>
<script>
// ```visualization <title> fences hold self-contained HTML that runs in a sandboxed
// iframe (scripts only: no network, no same-origin access, no top navigation).
const VIZ_LANG = /^(visualization|viz)\b\s*(.*)$/;
const VIZ_MAX_HEIGHT = 1000;  // inline, at most this tall or the transcript's height
const VIZ_LIBS = {};  // name -> source, set once by the app
const VIZ_USES = { d3: /\bd3\s*\./, chart: /\bnew\s+Chart\s*\(|\bChart\s*\./ };
const SERIES = {
  light: ["#b8562f", "#2f6fb8", "#3a8f5c", "#8a5cc2", "#b8860b", "#2a8f8f"],
  dark: ["#e08a63", "#6ea8e8", "#6cc28e", "#b48ee6", "#e2bd52", "#5cc8c8"],
};
let VIZ = [];  // [{title, code}] of the current render; ids index into it
let LIVE = false;  // rendering a reply that is still streaming
let THEME = { dark: false, colors: {} };

function setVizLibs(libs) { Object.assign(VIZ_LIBS, libs); }

// Inline, it is sized to its content by VizFit (vizfit.js), so it never scrolls itself,
// and reports that size. In the visualization window (windowed), it fits and zooms
// itself (vizWindowMode).
function vizDoc(id, windowed = false) {
  const { title, code } = VIZ[id];
  const series = THEME.dark ? SERIES.dark : SERIES.light;
  const vars = Object.entries(THEME.colors).map(([k, v]) => `--${k.replace(/_/g, "-")}:${v};`).join("")
    + series.map((c, i) => `--series-${i + 1}:${c};`).join("");
  const settings = { dark: THEME.dark, colors: THEME.colors, series };
  const libs = Object.entries(VIZ_USES).filter(([name, re]) => VIZ_LIBS[name] && re.test(code))
    .map(([name]) => `<script>${VIZ_LIBS[name].replace(/<\/script/gi, "<\\/script")}<\/script>`).join("");
  const chartDefaults = VIZ_USES.chart.test(code) ? `<script>if (window.Chart) {
    Chart.defaults.color = vizTheme.colors.muted; Chart.defaults.borderColor = vizTheme.colors.border;
    Chart.defaults.font.family = getComputedStyle(document.documentElement).fontFamily; }<\/script>` : "";
  const doc = `<!doctype html><html data-theme="${THEME.dark ? "dark" : "light"}"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:">
<style>:root{${vars}color-scheme:${THEME.dark ? "dark" : "light"};}
html,body{margin:0;background:var(--surface);color:var(--fg);font:13.5px/1.5 system-ui,sans-serif;}
body{padding:10px 12px;}${windowed ? "" : " html{overflow:hidden;}"} svg{overflow:visible;} input,select,button{font:inherit;accent-color:var(--accent);}</style>
<script>window.vizTheme = ${JSON.stringify(settings)};<\/script>${libs}${chartDefaults}
</head><body>${code}
<script>${windowed ? `(${vizWindowMode})();` : `(() => {
  const root = document.documentElement;
  const report = () => parent.postMessage({ vizSize: {
    width: root.scrollWidth, viewport: root.clientWidth,
    height: Math.ceil(Math.max(root.getBoundingClientRect().height, document.body.scrollHeight)) } }, "*");
  new ResizeObserver(report).observe(root);
  addEventListener("load", report);
  report();
})();`}<\/script></body></html>`;
  return { title, doc };
}

function vizHtml(title, code) {
  if (LIVE) return `<div class="viz pending">Building visualization${title ? ` “${esc(title)}”` : ""}…</div>`;
  const id = VIZ.push({ title, code }) - 1;
  return `<div class="viz"><div class="viz-head"><span class="title">${esc(title || "Visualization")}</span>`
    + `<a href="viz://open/${id}" title="Open in a larger window">Open ↗</a></div>`
    + `<div class="viz-frame"><iframe sandbox="allow-scripts" srcdoc="${esc(vizDoc(id).doc)}"></iframe></div></div>`;
}

const defaultFence = md.renderer.rules.fence;
md.renderer.rules.fence = (tokens, idx, options, env, self) => {
  const info = tokens[idx].info.trim();
  if (QUIZ_LANG.test(info)) return quizFence(tokens[idx].content) ?? defaultFence(tokens, idx, options, env, self);
  const m = info.match(VIZ_LANG);
  return m ? vizHtml(m[2].trim(), tokens[idx].content) : defaultFence(tokens, idx, options, env, self);
};

// Visualizations report their content size; VizFit fits each one into the width of the
// transcript and, so it can be seen whole, into its height.
let VIZ_FITS = [];
const vizSpace = box => () => ({
  width: box.parentElement.clientWidth, height: Math.max(200, Math.min(VIZ_MAX_HEIGHT, window.innerHeight - 70)) });
// Refit when a visualization's width changes (panel resized, scrollbar shown).
const vizResized = new ResizeObserver(entries => entries.forEach(en => VIZ_FITS.find(f => f.box === en.target.lastElementChild)?.refit()));

function fitVisualizations(root) {
  vizResized.disconnect();
  VIZ_FITS = [...root.querySelectorAll(".viz-frame")].map(box => {
    vizResized.observe(box.parentElement);
    return new VizFit(box.firstElementChild, box, vizSpace(box));
  });
}

window.addEventListener("message", e => {
  const size = e.data && e.data.vizSize;
  if (!size || typeof size.height !== "number") return;
  const fit = VIZ_FITS.find(f => f.frame.contentWindow === e.source);
  if (!fit) return;
  const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 40;
  fit.report(size);
  if (atBottom) window.scrollTo(0, document.body.scrollHeight);
});
let vizResize = 0;
window.addEventListener("resize", () => {
  cancelAnimationFrame(vizResize);
  vizResize = requestAnimationFrame(() => VIZ_FITS.forEach(f => f.refit()));
});
// ```quiz fences: the app parses them (quiz.py) and replaces each with `#<index>` into
// the message's `quizzes`; answers go back through the web channel and come back graded.
// Questions are drawn by quiz.js. Each quiz's questions are also review cards (srs.py).
const QUIZ_LANG = /^quiz\b/;
let MSG_QUIZZES = {};  // message id -> its quizzes, for the current render
let CURRENT_MSG = null;  // message being rendered, which its quiz fences resolve against
const QUIZ_DRAFTS = {};  // "msg:quiz:question" -> typed answer not yet submitted, kept across renders
const REVEALED = {};  // "msg:quiz:question" -> true for a flashcard whose back is showing, not yet rated

let bridge = null;
new QWebChannel(qt.webChannelTransport, channel => { bridge = channel.objects.quiz; });

function quizFence(content) {
  if (LIVE) return `<div class="quiz pending">Writing quiz…</div>`;
  const m = content.trim().match(/^#(\d+)$/);
  const quiz = m && CURRENT_MSG !== null ? (MSG_QUIZZES[CURRENT_MSG] || [])[+m[1]] : null;
  if (!quiz) return null;
  return `<div class="quiz" data-msg="${CURRENT_MSG}" data-quiz="${m[1]}">${quizInner(CURRENT_MSG, +m[1], quiz)}</div>`;
}

function points(a) {
  return a && a.status === "done" ? { correct: 1, partial: 0.5 }[a.verdict] || 0 : 0;
}

function deckToggle(quiz) {
  if (!quiz.review) return "";
  const on = quiz.review === "on";
  const title = on ? "Its questions come back in Review; click to leave them out" : "Left out of Review; click to add its questions back";
  return `<button class="deck${on ? " on" : ""}" data-act="deck" title="${title}">${on ? "In review" : "Not in review"}</button>`;
}

function quizInner(msg, qi, quiz) {
  const label = quiz.revises ? `Quiz · ${esc(quiz.title)} <span title="Revises the quiz “${esc(quiz.revises)}”">(revised)</span>` : `Quiz · ${esc(quiz.title)}`;
  const head = title => `<div class="quiz-head"><span class="title">${label}</span>${title}</div>`;
  if (quiz.error)
    return head("") + `<div class="quiz-broken">This quiz couldn't be read (${esc(quiz.error)}). Regenerate the reply for a new one.`
      + `<details><summary>Show its source</summary><pre><code>${esc(quiz.raw)}</code></pre></details></div>`;
  const qs = quiz.questions, answers = quiz.answers || {};
  const answered = qs.filter((_, i) => answers[i]).length;
  const graded = qs.filter((_, i) => answers[i] && answers[i].status === "done").length;
  let foot = "";
  if (answered) {
    const score = qs.reduce((sum, _, i) => sum + points(answers[i]), 0);
    const shown = Number.isInteger(score) ? score : score.toFixed(1);
    const text = graded === qs.length ? `Score: ${shown} / ${qs.length}` : `${answered} of ${qs.length} answered`;
    foot = `<div class="quiz-foot"><span class="score">${text}</span>`
      + `<button class="qbtn quiet" data-act="retake" title="Clear your answers and start again (review scheduling is kept)">Retake</button></div>`;
  }
  const revise = `<button class="revise" data-act="revise" title="Ask Claude to change this quiz; the questions it keeps keep their review cards">Revise…</button>`;
  const revised = quiz.revised_by
    ? `<div class="quiz-revised">Claude revised this quiz in a later reply. <button data-act="goto" data-to="${quiz.revised_by}">Show the revision</button></div>` : "";
  return head(`${quiz.revised_by ? "" : revise}${deckToggle(quiz)}<span>${answered} / ${qs.length}</span>`) + revised
    + qs.map((q, i) => {
      const key = `${msg}:${qi}:${i}`;
      const page = q.page ? `<a href="page://go/${q.page - 1}" title="Go to page ${q.page}">p. ${q.page}</a>` : "";
      return questionHtml(q, answers[i], {
        index: i, meta: `<span>Question ${i + 1} of ${qs.length}</span>${page}`,
        draft: QUIZ_DRAFTS[key], revealed: REVEALED[key], rate: true,
      });
    }).join("") + foot;
}

// Math fields in freshly rendered quizzes: Enter to check, drafts kept.
function setupQuizFields(root) {
  setupMathFields(root, qEl => submitQuiz(qEl, "numeric"), mf => { QUIZ_DRAFTS[quizKey(mf)] = mf.value; });
}

function quizKey(el) {
  const quiz = el.closest(".quiz"), q = el.closest(".q");
  return `${quiz.dataset.msg}:${quiz.dataset.quiz}:${q.dataset.q}`;
}

function submitQuiz(qEl, act, button) {
  const quiz = qEl.closest(".quiz");
  const msg = +quiz.dataset.msg, qi = +quiz.dataset.quiz, i = +qEl.dataset.q;
  const response = readResponse(MSG_QUIZZES[msg][qi].questions[i], qEl, act, button);
  if (!response || !bridge || qEl.classList.contains("busy")) return;
  qEl.classList.add("busy");
  bridge.answer(msg, qi, i, JSON.stringify(response));
}

document.addEventListener("click", ev => {
  const button = ev.target.closest("button[data-act]");
  const quiz = button && button.closest(".quiz");
  if (!quiz || button.disabled || !bridge) return;
  const act = button.dataset.act, qEl = button.closest(".q");
  const msg = +quiz.dataset.msg, qi = +quiz.dataset.quiz;
  if (act === "retake") bridge.retake(msg, qi);
  else if (act === "revise") bridge.revise(msg, qi);
  else if (act === "goto") {
    const el = document.querySelector(`.quiz[data-msg="${button.dataset.to}"]`);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  else if (act === "deck") bridge.toggleReview(msg, qi);
  else if (act === "regrade") bridge.regrade(msg, qi, +qEl.dataset.q);
  else if (act === "reveal") {
    REVEALED[quizKey(qEl)] = true;
    updateQuiz(msg, qi, MSG_QUIZZES[msg][qi]);
  } else submitQuiz(qEl, act, button);
});
document.addEventListener("keydown", ev => {
  if (ev.target.matches && ev.target.matches(".quiz textarea") && ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) {
    ev.preventDefault();
    submitQuiz(ev.target.closest(".q"), "written");
  }
});
document.addEventListener("input", ev => {
  if (ev.target.matches && ev.target.matches(".quiz textarea")) QUIZ_DRAFTS[quizKey(ev.target)] = ev.target.value;
});

// From the app: one quiz changed (an answer saved or graded, a retake, or a review toggle).
function updateQuiz(msg, qi, quiz) {
  (MSG_QUIZZES[msg] = MSG_QUIZZES[msg] || [])[qi] = quiz;
  const el = document.querySelector(`.quiz[data-msg="${msg}"][data-quiz="${qi}"]`);
  if (!el) return;
  for (const [i, a] of Object.entries(quiz.answers || {})) {
    delete QUIZ_DRAFTS[`${msg}:${qi}:${i}`];
    delete REVEALED[`${msg}:${qi}:${i}`];
  }
  el.innerHTML = quizInner(msg, qi, quiz);
  setupQuizFields(el);
}

// From the app: an answer it couldn't read (e.g. an unreadable number); the input stays.
function quizInputError(msg, qi, i, error) {
  const q = document.querySelector(`.quiz[data-msg="${msg}"][data-quiz="${qi}"] .q[data-q="${i}"]`);
  if (!q) return;
  q.classList.remove("busy");
  const el = q.querySelector(".q-error");
  if (el) el.textContent = error;
}

function snippetHtml(s) {
  const loc = `<span class="loc">p. ${s.page + 1} · jump to source</span>`;
  const body = s.kind === "image" ? `<img src="${esc(s.image_url)}">` : `<span class="quote">${esc(s.text)}</span>`;
  return `<a class="snip" href="jump://snippet/${s.id}">${loc}${body}</a>`;
}

const EDIT_ICON = `<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>`;
const QUIZ_ICON = `<svg viewBox="0 0 24 24"><path d="M9 11l2 2 4-4"/><rect width="16" height="18" x="4" y="3" rx="2"/><path d="M9 17h6"/></svg>`;
const SPEAK_ICON = `<svg viewBox="0 0 24 24"><path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.4 18.4a9 9 0 0 0 0-12.8"/></svg>`;
const REGEN_ICON = `<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>`;

function actionsHtml(m, isLast, idle) {
  if (!idle) return "";
  if (m.role === "user")
    return `<div class="actions user"><a href="edit://message/${m.id}" title="Edit this message and ask again">${EDIT_ICON}Edit</a></div>`;
  // A quiz on a reply that isn't itself a quiz.
  let quiz = m.role === "assistant" && !(m.quizzes || []).length
    ? `<a href="quiz://message/${m.id}" title="Draft a quiz request on this reply, to add instructions and send; the questions join your review deck">${QUIZ_ICON}Quiz me</a>` : "";
  if (m.role === "assistant")
    quiz += `<a href="speak://message/${m.id}" title="Read this reply aloud">${SPEAK_ICON}Listen</a>`;
  if (isLast) {
    const label = m.role === "error" ? "Retry" : "Regenerate";
    return `<div class="actions"><a href="regen://message/${m.id}" title="${label} this reply">${REGEN_ICON}${label}</a>${quiz}</div>`;
  }
  return quiz ? `<div class="actions reply">${quiz}</div>` : "";
}

function messageHtml(m, editing = false) {
  if (m.role === "user")
    return `<div class="msg user${editing ? " editing" : ""}">${(m.snippets || []).map(snippetHtml).join("")}<div class="body">${renderMarkdown(m.text)}</div></div>`;
  if (m.role === "error") return `<div class="msg error">${esc(m.text)}</div>`;
  CURRENT_MSG = m.id;
  try { return `<div class="msg assistant" data-id="${m.id}">${renderMarkdown(m.text)}</div>`; }
  finally { CURRENT_MSG = null; }
}

const CHAT_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;

function render(data) {
  const root = document.documentElement;
  root.dataset.theme = data.dark ? "dark" : "light";
  THEME = { dark: !!data.dark, colors: data.colors || {} };
  VIZ = [];
  LIVE = false;
  MSG_QUIZZES = Object.fromEntries(data.messages.map(m => [m.id, m.quizzes || []]));
  for (const [k, v] of Object.entries(data.colors || {})) root.style.setProperty(`--${k.replace(/_/g, "-")}`, v);
  const log = document.getElementById("log");
  // Actions only when nothing is streaming or being edited; while editing, the edited
  // message is marked and the turns it will replace are dimmed.
  const idle = data.streaming === null && data.editing == null;
  const editAt = data.messages.findIndex(m => m.id === data.editing);
  let html = data.messages.map((m, i) => {
    const cls = editAt >= 0 && i > editAt ? "turn stale" : "turn";
    return `<div class="${cls}">${messageHtml(m, i === editAt)}${actionsHtml(m, i === data.messages.length - 1, idle)}</div>`;
  }).join("");
  if (!data.messages.length) html = `<div class="empty">${CHAT_ICON}${esc(data.placeholder || "")}</div>`;
  if (data.streaming !== null) html += `<div class="msg assistant" id="stream"></div>`;
  log.innerHTML = html;
  fitVisualizations(log);
  setupQuizFields(log);
  if (SPEAKING) markSpeaking(false);
  if (data.streaming !== null) setStreaming(data.streaming);
  else if (editAt >= 0) document.querySelector(".msg.editing").scrollIntoView({ block: "nearest" });
  else window.scrollTo(0, document.body.scrollHeight);
}

// Reading a reply aloud: its blocks (paragraphs, list items, headings, table cells) are
// numbered in the page, which is the only place that knows how the Markdown was split.
const SAY_BLOCKS = "p, li, h1, h2, h3, h4, h5, h6, td, th, dt, dd, blockquote";
let SPEAKING = null;  // {id, n} of the block being read

function sayBlocks(msg) {
  return [...msg.querySelectorAll(SAY_BLOCKS)].filter(el =>
    !el.closest("pre, .viz, .quiz, a.snip, .katex") && !(el.matches("blockquote") && el.querySelector(SAY_BLOCKS)));
}

function speechBlocks(id) {
  const msg = document.querySelector(`.msg.assistant[data-id="${id}"]`);
  if (!msg) return [];
  const out = [];
  sayBlocks(msg).forEach((el, n) => {
    el.dataset.say = n;
    const copy = el.cloneNode(true);
    copy.querySelectorAll("ul, ol, pre, table, .viz, .quiz").forEach(e => e.remove());
    copy.querySelectorAll(SAY_BLOCKS).forEach(e => e.remove());
    copy.querySelectorAll(".katex-display, .katex").forEach(k => {
      if (!copy.contains(k)) return;  // inside a display formula already replaced
      const tex = k.querySelector('annotation[encoding="application/x-tex"]')?.textContent || "";
      k.replaceWith(k.classList.contains("katex-display") ? ` $$${tex}$$ ` : `$${tex}$`);
    });
    const text = copy.textContent.replace(/\s+/g, " ").trim();
    if (text) out.push({ n, text });
  });
  return out;
}

function markSpeaking(scroll) {
  document.querySelectorAll(".speaking").forEach(el => el.classList.remove("speaking"));
  if (!SPEAKING) return;
  const msg = document.querySelector(`.msg.assistant[data-id="${SPEAKING.id}"]`);
  const el = msg && sayBlocks(msg)[SPEAKING.n];
  if (!el) return;
  el.classList.add("speaking");
  if (scroll) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function speakHighlight(id, n) {
  SPEAKING = n >= 0 ? { id, n } : null;
  markSpeaking(true);
}

function setStreaming(text) {
  const el = document.getElementById("stream");
  if (!el) return;
  const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 40;
  LIVE = true;
  try { el.innerHTML = text ? renderMarkdown(text) : `<span class="cursor"></span>`; }
  finally { LIVE = false; }
  if (atBottom) window.scrollTo(0, document.body.scrollHeight);
}
</script>
</body>
</html>
