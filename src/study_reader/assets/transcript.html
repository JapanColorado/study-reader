<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<script src="markdown-it.min.js"></script>
<style>
  /* Fallbacks; the app sets these from theme.py on every render. */
  :root { --surface:#fbfaf8; --fg:#1f1e1c; --muted:#6b6862; --faint:#a19d95; --user:#efece6; --border:#dedad2;
          --accent:#b8562f; --accent-soft:#f4e2d8; --code:#f1eee8; --error:#c0392b; --scroll:#cfcac1; }
  html, body { margin:0; background:var(--surface); color:var(--fg); font:14.5px/1.6 system-ui, sans-serif; }
  ::selection { background:var(--accent-soft); }
  ::-webkit-scrollbar { width:11px; height:11px; }
  ::-webkit-scrollbar-thumb { background:var(--scroll); border-radius:3px; border:3px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background-color:var(--faint); }
  #log { padding:14px 12px 28px; }
  .empty { color:var(--muted); text-align:center; margin:56px auto 0; max-width:260px; line-height:1.5; }
  .empty svg { display:block; margin:0 auto 12px; width:36px; height:36px; stroke:var(--faint); }
  .msg { margin:0 0 18px; overflow-wrap:anywhere; }
  .msg.user { background:var(--user); border-radius:12px 12px 4px 12px; padding:10px 14px; margin-left:10%; }
  .msg.error { color:var(--error); border:1px solid var(--error); border-radius:10px; padding:8px 12px; font-size:13px; }
  .msg.assistant { padding:0 2px; }
  .msg p { margin:0.5em 0; }
  .msg > :first-child, .body > :first-child { margin-top:0; }
  .msg > :last-child, .body > :last-child { margin-bottom:0; }
  h1, h2, h3, h4 { line-height:1.3; margin:1em 0 0.4em; }
  h1 { font-size:1.3em; } h2 { font-size:1.18em; } h3 { font-size:1.06em; } h4 { font-size:1em; }
  ul, ol { padding-left:1.4em; } li { margin:0.2em 0; }
  hr { border:none; border-top:1px solid var(--border); margin:1em 0; }
  a { color:var(--accent); }
  a.snip { display:block; text-decoration:none; color:var(--muted); border-left:3px solid var(--accent);
           padding:2px 0 2px 10px; margin:0 0 10px; font-size:13px; cursor:pointer; border-radius:2px; }
  a.snip:hover { color:var(--fg); }
  a.snip .loc { display:block; font-size:11px; font-weight:600; color:var(--accent); margin-bottom:2px; }
  a.snip .quote { display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-wrap; }
  a.snip img { max-width:100%; max-height:220px; border:1px solid var(--border); border-radius:6px; display:block; }
  pre { background:var(--code); border:1px solid var(--border); padding:10px 12px; border-radius:8px; overflow-x:auto; }
  code { background:var(--code); padding:1px 5px; border-radius:4px; font-size:0.88em; font-family:ui-monospace, "JetBrains Mono", monospace; }
  pre code { padding:0; background:none; }
  table { border-collapse:collapse; margin:0.6em 0; } th, td { border:1px solid var(--border); padding:4px 9px; }
  th { background:var(--code); }
  blockquote { border-left:3px solid var(--border); margin:0.5em 0; padding-left:12px; color:var(--muted); }
  .katex-display { overflow-x:auto; overflow-y:hidden; padding:2px 0; }
  .viz { margin:0.7em 0; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--surface); }
  .viz-head { display:flex; align-items:center; gap:8px; padding:5px 6px 5px 11px; border-bottom:1px solid var(--border);
              background:var(--code); font-size:12px; color:var(--muted); }
  .viz-head .title { flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .viz-head a { color:var(--accent); text-decoration:none; padding:1px 7px; border-radius:5px; }
  .viz-head a:hover { background:var(--accent-soft); }
  .viz iframe { display:block; width:100%; height:160px; border:0; }
  .viz.pending { padding:14px 12px; color:var(--muted); font-size:13px; }
  .cursor::after { content:"▍"; color:var(--accent); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
</style>
</head>
<body>
<div id="log"></div>
<script>
const md = markdownit({ html: false, linkify: true });

// ```visualization <title> fences hold self-contained HTML that runs in a sandboxed
// iframe (scripts only: no network, no same-origin access, no top navigation).
const VIZ_LANG = /^(visualization|viz)\b\s*(.*)$/;
const VIZ_MAX_HEIGHT = 1000;
const VIZ_LIBS = {};  // name -> source, set once by the app
const VIZ_USES = { d3: /\bd3\s*\./, chart: /\bnew\s+Chart\s*\(|\bChart\s*\./ };
const SERIES = {
  light: ["#b8562f", "#2f6fb8", "#3a8f5c", "#8a5cc2", "#b8860b", "#2a8f8f"],
  dark: ["#e08a63", "#6ea8e8", "#6cc28e", "#b48ee6", "#e2bd52", "#5cc8c8"],
};
let VIZ = [];  // [{title, code}] of the current render; ids index into it
let LIVE = false;  // rendering a reply that is still streaming
let THEME = { dark: false, colors: {} };

function setVizLibs(libs) { Object.assign(VIZ_LIBS, libs); }

// inline: sized to its content by the transcript, so it never scrolls itself.
function vizDoc(id, inline = false) {
  const { title, code } = VIZ[id];
  const series = THEME.dark ? SERIES.dark : SERIES.light;
  const vars = Object.entries(THEME.colors).map(([k, v]) => `--${k.replace(/_/g, "-")}:${v};`).join("")
    + series.map((c, i) => `--series-${i + 1}:${c};`).join("");
  const settings = { dark: THEME.dark, colors: THEME.colors, series };
  const libs = Object.entries(VIZ_USES).filter(([name, re]) => VIZ_LIBS[name] && re.test(code))
    .map(([name]) => `<script>${VIZ_LIBS[name].replace(/<\/script/gi, "<\\/script")}<\/script>`).join("");
  const chartDefaults = VIZ_USES.chart.test(code) ? `<script>if (window.Chart) {
    Chart.defaults.color = vizTheme.colors.muted; Chart.defaults.borderColor = vizTheme.colors.border;
    Chart.defaults.font.family = getComputedStyle(document.documentElement).fontFamily; }<\/script>` : "";
  const doc = `<!doctype html><html data-theme="${THEME.dark ? "dark" : "light"}"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:">
<style>:root{${vars}color-scheme:${THEME.dark ? "dark" : "light"};}
html,body{margin:0;background:var(--surface);color:var(--fg);font:13.5px/1.5 system-ui,sans-serif;}
body{padding:10px 12px;}${inline ? " html{overflow:hidden;}" : ""} svg{overflow:visible;} input,select,button{font:inherit;accent-color:var(--accent);}</style>
<script>window.vizTheme = ${JSON.stringify(settings)};<\/script>${libs}${chartDefaults}
</head><body>${code}
<script>(() => {
  const report = () => parent.postMessage({ vizHeight: Math.ceil(Math.max(
    document.documentElement.getBoundingClientRect().height, document.body.scrollHeight)) }, "*");
  new ResizeObserver(report).observe(document.documentElement);
  addEventListener("load", report);
  report();
})();<\/script></body></html>`;
  return { title, doc };
}

function vizHtml(title, code) {
  if (LIVE) return `<div class="viz pending">Building visualization${title ? ` “${esc(title)}”` : ""}…</div>`;
  const id = VIZ.push({ title, code }) - 1;
  return `<div class="viz"><div class="viz-head"><span class="title">${esc(title || "Visualization")}</span>`
    + `<a href="viz://open/${id}" title="Open in a larger window">Open ↗</a></div>`
    + `<iframe sandbox="allow-scripts" srcdoc="${esc(vizDoc(id, true).doc)}"></iframe></div>`;
}

const defaultFence = md.renderer.rules.fence;
md.renderer.rules.fence = (tokens, idx, options, env, self) => {
  const m = tokens[idx].info.trim().match(VIZ_LANG);
  return m ? vizHtml(m[2].trim(), tokens[idx].content) : defaultFence(tokens, idx, options, env, self);
};

// Visualizations report their content height; size their iframe to match.
window.addEventListener("message", e => {
  const height = e.data && e.data.vizHeight;
  if (typeof height !== "number") return;
  const frame = [...document.querySelectorAll(".viz iframe")].find(f => f.contentWindow === e.source);
  if (!frame) return;
  const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 40;
  frame.style.height = `${Math.min(Math.max(height, 40), VIZ_MAX_HEIGHT)}px`;
  if (atBottom) window.scrollTo(0, document.body.scrollHeight);
});
const MATH = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$(?!\s)([^$\n]+?)(?<!\s)\$(?!\d)/g;
const CODE = /(```[\s\S]*?(?:```|$)|`[^`\n]*`)/;

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// Math is lifted out before Markdown runs so underscores and backslashes survive.
function renderMarkdown(src) {
  const store = [];
  const parts = src.split(CODE).map((part, i) => {
    if (i % 2) return part;
    return part.replace(MATH, (m, d1, d2, i1, i2) => {
      const display = d1 !== undefined || d2 !== undefined;
      store.push({ tex: d1 ?? d2 ?? i1 ?? i2, display });
      return `@@MATH${store.length - 1}@@`;
    });
  });
  return md.render(parts.join("")).replace(/@@MATH(\d+)@@/g, (m, n) => {
    const { tex, display } = store[+n];
    try { return katex.renderToString(tex, { displayMode: display, throwOnError: false }); }
    catch (e) { return esc(tex); }
  });
}

function snippetHtml(s) {
  const loc = `<span class="loc">p. ${s.page + 1} · jump to source</span>`;
  const body = s.kind === "image" ? `<img src="${esc(s.image_url)}">` : `<span class="quote">${esc(s.text)}</span>`;
  return `<a class="snip" href="jump://snippet/${s.id}">${loc}${body}</a>`;
}

function messageHtml(m) {
  if (m.role === "user")
    return `<div class="msg user">${(m.snippets || []).map(snippetHtml).join("")}<div class="body">${renderMarkdown(m.text)}</div></div>`;
  if (m.role === "error") return `<div class="msg error">${esc(m.text)}</div>`;
  return `<div class="msg assistant">${renderMarkdown(m.text)}</div>`;
}

const CHAT_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;

function render(data) {
  const root = document.documentElement;
  root.dataset.theme = data.dark ? "dark" : "light";
  THEME = { dark: !!data.dark, colors: data.colors || {} };
  VIZ = [];
  LIVE = false;
  for (const [k, v] of Object.entries(data.colors || {})) root.style.setProperty(`--${k.replace(/_/g, "-")}`, v);
  const log = document.getElementById("log");
  let html = data.messages.map(messageHtml).join("");
  if (!data.messages.length) html = `<div class="empty">${CHAT_ICON}${esc(data.placeholder || "")}</div>`;
  if (data.streaming !== null) html += `<div class="msg assistant" id="stream"></div>`;
  log.innerHTML = html;
  if (data.streaming !== null) setStreaming(data.streaming);
  else window.scrollTo(0, document.body.scrollHeight);
}

function setStreaming(text) {
  const el = document.getElementById("stream");
  if (!el) return;
  const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 40;
  LIVE = true;
  try { el.innerHTML = text ? renderMarkdown(text) : `<span class="cursor"></span>`; }
  finally { LIVE = false; }
  if (atBottom) window.scrollTo(0, document.body.scrollHeight);
}
</script>
</body>
</html>
