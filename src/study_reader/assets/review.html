<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="quiz.css">
<script src="katex/katex.min.js"></script>
<script src="markdown-it.min.js"></script>
<script src="markdown.js"></script>
<script src="mathlive/mathlive.min.js"></script>
<script src="mathfield.js"></script>
<script src="quiz.js"></script>
<script src="progress.js"></script>
<script src="confetti.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<style>
  #root { max-width:720px; margin:0 auto; padding:14px 6px 30px; overflow-wrap:anywhere; }
  html.page #root { padding-top:28px; }
  html.page, html.page body { background:var(--window); }
  header { margin:0 0 14px; }
  header h1 { font-size:1.35em; font-weight:700; letter-spacing:-0.01em; margin:0; line-height:1.25; }
  html.page header h1 { font-size:27px; }
  html.page #root { max-width:760px; }
  html.page .card .q { font-size:16px; padding:20px 24px 22px; }
  html.page .bar { font-size:13px; }
  header .head-row { display:flex; align-items:center; gap:8px; }
  header .head-row h1 { flex:1; min-width:0; }
  header .crumbs { color:var(--muted); font-size:13px; margin-top:2px; }
  header .crumbs a { color:var(--muted); text-decoration:none; } header .crumbs a:hover { color:var(--accent); }
  .stack > * + * { margin-top:14px; }
  .hero .counts { display:flex; gap:28px; flex-wrap:wrap; align-items:flex-end; }
  .hero .sub { color:var(--muted); font-size:13px; margin:4px 0 16px; }
  .hero .actions { display:grid; gap:8px; grid-template-columns:1fr auto auto; }
  @media (max-width: 520px) {
    .hero .actions { grid-template-columns:1fr 1fr; }
    .hero .actions .btn.big { grid-column:1 / -1; }
  }
  .hero .done { font-size:17px; font-weight:650; margin:4px 0 2px; }
  .msg { color:var(--muted); text-align:center; margin:18px auto; line-height:1.5; }
  .msg strong { color:var(--fg); }
  .hint { color:var(--muted); font-size:12.5px; line-height:1.55; }
  .keys { font-size:11.5px; color:var(--faint); margin-top:9px; text-align:center; }
  .hero .keys { text-align:left; }
  .empty svg { display:block; margin:30px auto 12px; width:36px; height:36px; stroke:var(--faint); fill:none;
               stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
  .bar { display:flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); margin-bottom:8px; }
  .bar .grow { flex:1; }
  .bar a { color:var(--muted); text-decoration:none; padding:2px 8px; border-radius:6px; }
  .bar a:hover { color:var(--fg); background:var(--hover); }
  .bar .count { font-weight:650; font-variant-numeric:tabular-nums; }
  .bar .count .due { color:var(--accent); } .bar .count .new { color:var(--new); }
  .card { background:var(--raised); border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:0 1px 3px var(--shadow); }
  .card .q { border-bottom:none; padding:14px 16px 16px; }
  .card .q-meta { flex-wrap:wrap; gap:4px 8px; }
  .card .q-meta .tag { color:var(--new); }
  .card .q-meta .book { color:var(--fg); }
  .card .q-meta .src { white-space:nowrap; }
  /* What to review: decks, books (with their sections) or the open book's sections */
  .tabs { display:flex; gap:2px; margin:-4px 0 8px; border-bottom:1px solid var(--border); }
  .tabs a { font-size:13px; font-weight:600; color:var(--muted); text-decoration:none; padding:4px 10px 7px; margin-bottom:-1px;
            border-bottom:2px solid transparent; }
  .tabs a:hover { color:var(--fg); }
  .tabs a.on { color:var(--accent); border-bottom-color:var(--accent); }
  .tabs .grow { flex:1; }
  .decks { margin:0 -8px; }
  .deck { display:flex; align-items:center; gap:6px; padding:4px 8px; border-radius:7px; cursor:pointer; font-size:13.5px; }
  .deck:hover { background:var(--hover); }
  .deck.sel { background:var(--accent-soft); }
  .deck .tw { width:14px; flex:none; color:var(--muted); text-align:center; font-size:10px; }
  .deck .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .deck .n { width:44px; text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  .deck .n.due { color:var(--accent); } .deck .n.new { color:var(--new); }
  .deck .n.zero { color:var(--faint); opacity:0.5; font-weight:400; }
  .deck.all .name { font-weight:600; }
  .deck-head { display:flex; gap:6px; padding:0 8px 4px; font-size:11px; color:var(--faint); font-weight:650;
               text-transform:uppercase; letter-spacing:0.04em; }
  .deck-head .name { flex:1; } .deck-head .n { width:44px; text-align:right; }
  .links { display:flex; gap:6px; justify-content:center; }
  [data-act="calc"] { display:inline-flex; align-items:center; gap:5px; }
  [data-act="calc"] svg { width:14px; height:14px; flex:none; stroke:currentColor; fill:none; stroke-width:2;
                          stroke-linecap:round; stroke-linejoin:round; }
  [data-act="calc"].on { color:var(--accent); }
  .ach-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:4px; margin-top:8px; }
  .ach { display:flex; gap:8px; align-items:center; padding:4px 6px; border-radius:7px; font-size:12.5px; line-height:1.3; }
  .ach .i { font-size:20px; flex:none; }
  .ach .d { color:var(--muted); font-size:11.5px; }
  .ach.locked { opacity:0.45; } .ach.locked .i { filter:grayscale(1); }
  details.panel > summary { cursor:pointer; font-size:13px; font-weight:650; letter-spacing:0.04em; text-transform:uppercase; color:var(--muted); }
  .summary { text-align:center; }
  .summary h2 { font-size:1.2em; margin:0 0 10px; }
  .summary .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(90px, 1fr)); gap:8px; }
  .summary .n { font-size:1.35em; font-weight:700; font-variant-numeric:tabular-nums; }
  .summary .l { font-size:12px; color:var(--muted); }
  .prog { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin:0 0 10px; }
  .prog .track { flex:1; height:6px; border-radius:3px; background:var(--hover); overflow:hidden; }
  .prog .track i { display:block; height:100%; border-radius:3px; background:var(--accent); transition:width 0.4s; }
  .prog .label { font-variant-numeric:tabular-nums; }
  .combo { font-weight:700; color:var(--warning); display:inline-block; white-space:nowrap; }
  .combo.pulse { animation:pulse 0.5s; }
  #toasts { position:fixed; top:10px; right:10px; z-index:60; display:flex; flex-direction:column; gap:6px; pointer-events:none; }
  .toast { display:flex; gap:9px; align-items:center; max-width:270px; font-size:13px; line-height:1.35; background:var(--raised);
           border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:9px; padding:7px 12px;
           box-shadow:0 4px 16px rgba(0,0,0,0.18); animation:toast-in 0.35s ease-out; }
  .toast .i { font-size:22px; }
  .toast .d { color:var(--muted); font-size:12px; }
  .toast.out { animation:toast-out 0.4s forwards; }
  .float { position:fixed; left:50%; top:46px; z-index:55; pointer-events:none; font-weight:700; font-size:15px;
           color:var(--accent); animation:float-up 1.2s ease-out forwards; }
  @keyframes float-up { from { opacity:1; transform:translate(-50%, 0); } to { opacity:0; transform:translate(-50%, -44px); } }
  @keyframes toast-in { from { opacity:0; transform:translateX(30px); } to { opacity:1; transform:none; } }
  @keyframes toast-out { to { opacity:0; transform:translateX(30px); } }
  @keyframes pulse { 50% { transform:scale(1.35); } }
  @media (prefers-reduced-motion: reduce) { .toast, .float, .combo.pulse { animation:none; } }
  /* Flags (as Anki's), on the phone app's cards */
  .flagdot { display:inline-block; width:9px; height:9px; border-radius:50%; vertical-align:middle; }
  .flags { display:flex; gap:10px; justify-content:center; align-items:center; margin:0 0 10px; }
  .flags button { width:30px; height:30px; border-radius:50%; border:2px solid transparent; cursor:pointer; }
  .flags button.on { border-color:var(--fg); }
  .flags button.none { background:var(--raised); border-color:var(--border); color:var(--muted); font:inherit; font-size:14px; }
  /* The Android app (android/): touch-sized targets, no keyboard hints, rating buttons at hand. */
  html.mobile, html.mobile body { font-size:16px; -webkit-tap-highlight-color:transparent; }
  html.mobile #root { padding:6px 12px 120px; }
  html.mobile .keys, html.mobile .hint { display:none; }
  html.mobile .bar { font-size:13.5px; gap:2px; flex-wrap:wrap; }
  html.mobile .bar a { padding:7px 9px; }
  html.mobile .actions .btn { padding:10px 14px; }
  html.mobile .actions .btn.big { padding:13px 18px; font-size:1.05em; }
  html.mobile .deck { padding:9px 8px; font-size:15px; }
  html.mobile .deck .tw { width:22px; font-size:13px; }
  html.mobile .choice { padding:11px 12px; }
  html.mobile .qbtn { padding:9px 16px; font-size:14.5px; }
  html.mobile .submit-row { font-size:13px; }
  html.mobile .rate-dock { position:fixed; left:0; right:0; bottom:0; z-index:40; padding:8px 10px 12px;
                           background:var(--surface); border-top:1px solid var(--border); }
  html.mobile .rate-dock .submit-row { margin:0 0 2px; justify-content:center; }
  html.mobile .rate-row { margin-top:4px; max-width:680px; margin-left:auto; margin-right:auto; }
  html.mobile .rate { padding:11px 4px; font-size:15px; }
  html.mobile .rate .when { font-size:12.5px; }
  html.mobile .rate .key { display:none; }
  html.mobile #toasts { left:10px; right:10px; align-items:center; }
  html.mobile .ach-grid { grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); }
</style>
</head>
<body>
<div id="root"></div>
<script>
// The app picks the cards and schedules them (srs.py); this page shows the overview or one card,
// and sends answers, ratings and actions back through the web channel.
let bridge = null;
// The Android app (android/) puts its bridge on the page as ReviewApp, with the same methods.
const MOBILE = !!window.ReviewApp;
if (MOBILE) { bridge = window.ReviewApp; document.documentElement.classList.add("mobile"); }
else new QWebChannel(qt.webChannelTransport, channel => { bridge = channel.objects.review; });
// Anki's flag colors (browser.py's FLAGS).
const FLAG_COLORS = { 1: "#e25252", 2: "#f59a3a", 3: "#4fb35a", 4: "#3d8bf2", 5: "#ec79c6", 6: "#3cc7c2", 7: "#9a6be0" };
const FLAG_NAMES = { 1: "Red", 2: "Orange", 3: "Green", 4: "Blue", 5: "Pink", 6: "Turquoise", 7: "Purple" };

const CARDS_ICON = `<svg viewBox="0 0 24 24"><rect width="14" height="16" x="7" y="5" rx="2"/><path d="M4 16V5a2 2 0 0 1 2-2h9"/></svg>`;
let CARD = null;  // the card on display, as the app sent it; null on the overview
// Cards the reviewer rates on their own once the answer shows (in review, free responses too).
const selfRated = q => SELF_RATED.includes(q.type) || q.type === "free";

const OPEN = new Set();  // rows expanded in the overview's lists: "d<deck id>", "b<book id>", "s<section tag>"
const num = (n, cls) => `<span class="n ${cls}${n ? "" : " zero"}">${n}</span>`;
const twist = (key, has) => `<span class="tw" data-act="twist" data-key="${esc(key)}">${has ? (OPEN.has(key) ? "▾" : "▸") : ""}</span>`;

const PLAY = `<svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>`;
// The desktop's Calculator button (theme.py's "calculator" icon), and setCalc to show it open or closed.
const CALC_ICON = `<svg viewBox="0 0 24 24"><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M8 6h8"/><path d="M16 14v4"/>`
  + `<path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/>`
  + `<path d="M12 18h.01"/><path d="M8 18h.01"/></svg>`;
const CALC_TITLE = "Show or hide the calculator (F11)";
function setCalc(on) {
  if (LAST) LAST.calc = on;
  if (CARD) CARD.calc = on;
  document.querySelectorAll('[data-act="calc"]').forEach(el => el.classList.toggle("on", on));
}
let LAST = null;  // the overview last shown, to redraw when the picker's tab changes
let PICK = null;  // the picker's tab on the Review page: "decks" or "books" (null: by what is picked)

// Every deck, with its own and its subdecks' counts; clicking one picks what to review.
function decksHtml(o) {
  const byParent = {};
  for (const d of o.decks) (byParent[d.parent ?? 0] ||= []).push(d);
  const row = (d, depth) => {
    const kids = byParent[d.id] || [];
    let html = `<div class="deck${o.deck === d.id ? " sel" : ""}" data-act="deck" data-deck="${d.id}" title="${esc(d.path)}"`
      + ` style="padding-left:${8 + depth * 16}px">${twist(`d${d.id}`, kids.length)}`
      + `<span class="name">${esc(d.name)}</span>${num(d.due, "due")}${num(d.new, "new")}</div>`;
    if (OPEN.has(`d${d.id}`)) for (const k of kids) html += row(k, depth + 1);
    return html;
  };
  return `<div class="decks"><div class="deck-head"><span class="tw"></span><span class="name">Deck</span><span class="n">Due</span><span class="n">New</span></div>`
    + `<div class="deck all${o.deck === null && o.book === null ? " sel" : ""}" data-act="deck" data-deck="0"><span class="tw"></span><span class="name">All decks</span>`
    + `${num(o.all_due, "due")}${num(o.all_new, "new")}</div>`
    + (byParent[0] || []).map(d => row(d, 0)).join("") + `</div>`;
}

// A book's sections (srs.sections) as rows under it; clicking one reviews just that section.
function sectionRows(sections, bookId, selected, depth) {
  const byParent = {};
  for (const s of sections) (byParent[s.parent ?? ""] ||= []).push(s);
  const row = (s, depth) => {
    const kids = byParent[s.tag] || [];
    let html = `<div class="deck${selected === s.tag ? " sel" : ""}" data-act="section" data-book="${bookId}" data-tag="${esc(s.tag)}"`
      + ` title="${esc(s.tag.split("::").slice(1).join(" › ").replace(/_/g, " "))}" style="padding-left:${8 + depth * 16}px">`
      + `${twist(`s${s.tag}`, kids.length)}<span class="name">${esc(s.name)}</span>${num(s.due, "due")}${num(s.new, "new")}</div>`;
    if (OPEN.has(`s${s.tag}`)) for (const k of kids) html += row(k, depth + 1);
    return html;
  };
  return (byParent[""] || []).map(s => row(s, depth)).join("");
}

// Every book with cards (all_books), each opening onto its sections.
function booksHtml(o) {
  return `<div class="decks"><div class="deck-head"><span class="tw"></span><span class="name">Book</span><span class="n">Due</span><span class="n">New</span></div>`
    + o.books.map(b => {
      const key = `b${b.id}`;
      let html = `<div class="deck${o.book === b.id && !o.section ? " sel" : ""}" data-act="book" data-book="${b.id}" title="${esc(b.title)}">`
        + `${twist(key, b.sections.length)}<span class="name">${esc(b.title)}</span>${num(b.due, "due")}${num(b.new, "new")}</div>`;
      if (OPEN.has(key)) html += sectionRows(b.sections, b.id, o.book === b.id ? o.section : null, 1);
      return html;
    }).join("") + `</div>`;
}

// The open book's sections, to review just one.
function sectionsHtml(o) {
  return `<div class="decks"><div class="deck-head"><span class="tw"></span><span class="name">Section</span><span class="n">Due</span><span class="n">New</span></div>`
    + `<div class="deck all${o.section ? "" : " sel"}" data-act="section" data-book="0" data-tag=""><span class="tw"></span><span class="name">Whole book</span>`
    + `${num(o.whole_due, "due")}${num(o.whole_new, "new")}</div>`
    + sectionRows(o.sections, 0, o.section, 0) + `</div>`;
}

// What to review: decks or books (the Review page), or the open book's sections.
function pickerHtml(o) {
  if (!o.all) {
    return o.sections && o.sections.length
      ? `<section class="panel"><div class="tabs"><a class="on">Sections</a></div>${sectionsHtml(o)}</section>` : "";
  }
  const hasDecks = !!(o.decks && o.decks.length), hasBooks = !!(o.books && o.books.length);
  if (!hasDecks && !hasBooks) return "";
  let tab = PICK || (o.book !== null && hasBooks ? "books" : hasDecks ? "decks" : "books");
  if (tab === "decks" && !hasDecks) tab = "books";
  if (tab === "books" && !hasBooks) tab = "decks";
  const link = (name, label) => `<a href="#" data-act="pick" data-tab="${name}" class="${tab === name ? "on" : ""}">${label}</a>`;
  return `<section class="panel"><div class="tabs">${hasDecks ? link("decks", "Decks") : ""}${hasBooks ? link("books", "Books") : ""}</div>`
    + (tab === "decks" ? decksHtml(o) : booksHtml(o)) + `</section>`;
}

// The counts and the buttons that start a session.
function heroHtml(o) {
  let html = `<section class="panel hero"><div class="counts">`
    + `<div class="big-count"><span class="n due-c${o.due ? "" : " zero"}">${comma(o.due)}</span><span class="l">due</span></div>`
    + `<div class="big-count"><span class="n new-c${o.new ? "" : " zero"}">${comma(o.new)}</span><span class="l">new today</span></div></div>`
    + `<div class="sub">${comma(o.total)} card${o.total === 1 ? "" : "s"}${o.new_total > o.new ? ` · ${comma(o.new_total)} new waiting` : ""}`
    + `${o.suspended ? ` · ${comma(o.suspended)} suspended` : ""}</div>`;
  if (o.status) html += `<div class="nudge">${esc(o.status)}</div>`;  // the Android app's sync status
  if (o.reviewed && !o.summary) html += `<div class="msg"><strong>${plural(o.reviewed, "card")} reviewed.</strong></div>`;
  const more = o.reviewed ? " more" : "";
  if (o.ready) {
    html += `<div class="actions"><button class="btn primary big" data-act="start">${PLAY}${o.reviewed ? "Keep going" : "Start review"}</button>`
      + `<button class="btn" data-act="start" data-limit="cards" title="A short session: just ${o.quick.cards} cards">Just ${o.quick.cards}${more} cards</button>`
      + `<button class="btn" data-act="start" data-limit="time" title="A short session: as many cards as fit in ${o.quick.minutes} minutes">${o.quick.minutes}${more} minutes</button></div>`
      + `<div class="keys"><kbd>Space</kbd> to start · <kbd>5</kbd> for ${o.quick.cards} cards</div>`;
  } else {
    html += `<div class="done done-c">All caught up ✓</div><div class="hint">${o.next ? `The next card is due ${esc(o.next)}.` : ""}`
      + (o.new_total > o.new ? ` Today's ${o.new_per_day} new cards are done; more tomorrow.` : "") + `</div>`;
  }
  return html + `</section>`;
}

function headerHtml(o) {
  let crumbs;
  if (o.all) crumbs = o.title ? `<a href="#" data-act="deck" data-deck="0">← Every deck and book</a>` : "Every deck and book";
  else crumbs = o.section ? `<a href="#" data-act="section" data-book="0" data-tag="">← The whole book</a>` : "This book's cards";
  // The desktop's Calculator button comes with o.calc (whether it is open), which the app never sends.
  const calc = o.calc == null ? "" : `<a class="btn ghost calc${o.calc ? " on" : ""}" href="#" data-act="calc" title="${CALC_TITLE}">${CALC_ICON}Calculator</a>`;
  return `<header><div class="head-row"><h1>${o.title ? esc(o.title) : "Review"}</h1>${calc}</div><div class="crumbs">${crumbs}</div></header>`;
}

function showOverview(o) {
  CARD = null;
  LAST = o;
  const root = document.getElementById("root");
  if (o.disabled) { root.innerHTML = ""; return; }
  document.documentElement.classList.toggle("page", !!o.all);
  const how = `Every question in a quiz Claude writes becomes a review card. Choose <em>Quiz me</em>
    (<kbd>Ctrl+Shift+Q</kbd>) on a selection or the section you're reading, or under one of
    Claude's replies.`;
  if (!o.total) {
    root.innerHTML = headerHtml(o) + `<div class="empty">${CARDS_ICON}<div class="msg">${o.empty ? esc(o.empty) : `No review cards ${o.all ? "yet" : "for this book yet"}.`}</div></div>`
      + `<div class="hint">${how}</div>`;
    return;
  }
  const g = o.game;
  let html = headerHtml(o) + `<div class="stack">`;
  if (o.summary) html += summaryHtml(o.summary, !!g);
  html += heroHtml(o);
  if (g) html += `<div>${playerHtml(g)}</div>`;
  html += pickerHtml(o);
  if (g) html += extrasHtml(g);
  // The Android app (o.links) offers its own links, or none.
  const links = o.links || (o.all ? [] : [["browse", "Browse cards"], ["stats", "Statistics"]]);
  if (links.length) html += `<div class="links">${links.map(([act, label]) => `<a class="btn ghost" href="#" data-act="${act}">${esc(label)}</a>`).join("")}</div>`;
  html += `<div class="hint">${how}</div></div>`;
  root.innerHTML = html;
  if (g) heatmap(document.getElementById("heat"), g.heat, { fit: true });
}

// -- rewards (gamify.py) ------------------------------------------------------------------
let ACH_OPEN = false;  // the achievements list is expanded

function summaryHtml(s, game) {
  const head = s.caught_up ? "All caught up! 🎉" : s.quick ? "Quick session done! 🍪" : "Session summary";
  const mins = `${Math.floor(s.seconds / 60)}:${String(s.seconds % 60).padStart(2, "0")}`;
  const stat = (n, l) => `<div><div class="n">${n}</div><div class="l">${l}</div></div>`;
  let cells = stat(s.reviewed, s.reviewed === 1 ? "card" : "cards")
    + stat(`${Math.round(100 * s.passed / s.reviewed)}%`, "recalled")
    + stat(mins, "time");
  if (game) cells += stat(`+${comma(s.xp)}`, "XP") + stat(s.best, "best combo");
  if (s.matured) cells += stat(s.matured, s.matured === 1 ? "card matured" : "cards matured");
  if (s.stability) cells += stat(`+${comma(s.stability)}d`, "memory stability");
  return `<section class="panel summary"><h2>${head}</h2><div class="grid">${cells}</div></section>`;
}

function extrasHtml(g) {
  const got = g.achievements.filter(a => a.unlocked).length;
  const list = g.achievements.map(a => `<div class="ach${a.unlocked ? "" : " locked"}" title="${esc(a.desc)}">`
    + `<span class="i">${a.icon}</span><div><div>${esc(a.name)}</div><div class="d">${esc(a.desc)}</div></div></div>`).join("");
  return `<section class="panel"><div class="panel-head"><h2>Recent weeks</h2></div><div class="heat" id="heat"></div></section>`
    + `<details class="panel" id="ach"${ACH_OPEN ? " open" : ""}><summary>Achievements · ${got} of ${g.achievements.length}</summary>`
    + `<div class="ach-grid">${list}</div></details>`;
}

document.addEventListener("toggle", ev => { if (ev.target.id === "ach") ACH_OPEN = ev.target.open; }, true);

function toast(icon, title, detail) {
  let box = document.getElementById("toasts");
  if (!box) { box = document.createElement("div"); box.id = "toasts"; document.body.appendChild(box); }
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span class="i">${icon}</span><div><div><strong>${esc(title)}</strong></div>${detail ? `<div class="d">${esc(detail)}</div>` : ""}</div>`;
  box.appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 450); }, 3800);
}

function floatText(text) {
  const el = document.createElement("div");
  el.className = "float";
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1300);
}

// From the app: what the last review or session earned.
function celebrate(events) {
  for (const e of events) {
    if (e.kind === "xp") floatText(`+${e.xp} XP`);
    else if (e.kind === "combo") {
      const el = document.querySelector(".combo");
      if (el) { el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse"); }
      confetti({ count: 25, spread: 400 });
    }
    else if (e.kind === "milestone") { confetti({ count: 70 }); toast("🎉", `${e.n} cards this session!`, "Keep it rolling."); }
    else if (e.kind === "level") { confetti({ count: 160, spread: 1000 }); toast("⭐", `Level ${e.level}!`, e.title); }
    else if (e.kind === "goal") { confetti({ count: 120 }); toast("🎯", "Daily goal reached!", "Anything more is a bonus."); }
    else if (e.kind === "freeze") toast("❄️", "Streak freeze earned", `You have ${e.freezes}. Each one covers a missed day.`);
    else if (e.kind === "achievement") { confetti({ count: 80 }); toast(e.icon, `Achievement: ${e.name}`, e.desc); }
    else if (e.kind === "welcome") toast("🤝", "Welcome back!", "Every card counts. Start small.");
    else if (e.kind === "done") {
      if (e.caught_up) confetti({ count: 240, spread: 1400 });
      else if (e.quick) confetti({ count: 110 });
    }
  }
}

function showCard(c) {
  CARD = c;
  const q = c.question, a = c.answer;
  const meta = [
    c.new ? `<span class="tag">New</span>` : "",
    c.varied ? `<span class="tag" title="Claude wrote this version with new numbers after your last review">New numbers</span>` : "",
    c.book ? `<span class="book">${esc(c.book)}</span>` : "",
    `<span title="${esc(c.deck)}">${esc(c.title || c.deck.split("::").pop())}</span>`,
    c.page !== null ? `<a class="src" href="#" data-act="source" title="Show this page in the book">p. ${c.page + 1}</a>` : "",
    c.chat ? `<a class="src" href="#" data-act="chat" title="Open the chat the quiz is in">Open chat</a>` : "",
    c.flag ? `<span title="${FLAG_NAMES[c.flag]} flag"><span class="flagdot" style="background:${FLAG_COLORS[c.flag]}"></span></span>` : "",
  ].filter(Boolean).join("<span>·</span>");
  // Free responses are rated by the reviewer: recall the answer, or write it out first.
  const freeActions = `<div class="submit-row"><span class="grow">Answer in your head, or write it out first (Ctrl+Enter)</span>`
    + `<button class="qbtn" data-act="show">Show answer</button></div>`;
  const actions = c.actions || [
    ["skip", "Skip", "Show another card first"],
    ["edit", "Edit", "Open this card in the browser to edit it"],
    ["suspend", "Suspend", "Leave this card out of review (the quiz's “In review” toggle brings it back)"],
    ["delete", "Delete", "Delete this card and its history"],
  ];
  if (!c.actions && c.calc != null) actions.unshift(["calc", "Calculator", CALC_TITLE]);
  let html = `<div class="bar"><a href="#" data-act="stop" title="Back to the overview">← Overview</a><span class="grow"></span>`
    + `<span class="count"><span class="due">${c.remaining.due}</span> due · <span class="new">${c.remaining.new}</span> new</span>`
    + actions.map(([act, label, title]) => `<a href="#" data-act="${act}" title="${esc(title)}"`
      + `${act === "calc" ? ` class="calc${c.calc ? " on" : ""}">${CALC_ICON}` : ">"}${esc(label)}</a>`).join("") + `</div>`;
  if (FLAGS_OPEN) html += `<div class="flags">${[1, 2, 3, 4, 5, 6, 7].map(n => `<button data-act="setflag" data-k="${n}"`
    + ` class="${c.flag === n ? "on" : ""}" style="background:${FLAG_COLORS[n]}" title="${FLAG_NAMES[n]}"></button>`).join("")}`
    + `<button class="none" data-act="setflag" data-k="0" title="No flag">✕</button></div>`;
  html += progressHtml(c);
  html += `<div class="card">${questionHtml(q, a || undefined, { meta, freeActions, openAnswer: true })}`;
  html += `</div>`;
  if (c.previews && MOBILE) {
    html += `<div class="rate-dock"><div class="submit-row">How well did you know it?</div>${ratingRow(c.previews, c.suggested)}</div>`;
  } else if (c.previews) {
    html += `<div class="submit-row" style="margin-top:12px">How well did you know it?</div>${ratingRow(c.previews, c.suggested)}`
      + `<div class="keys"><kbd>1</kbd>–<kbd>4</kbd> to rate · <kbd>Space</kbd> for ${RATING_LABELS[c.suggested || 3]}</div>`;
  } else if (selfRated(q) && !a) {
    html += `<div class="keys"><kbd>Space</kbd> to show the answer${q.type === "free" ? " · <kbd>Esc</kbd> leaves the answer box" : ""}</div>`;
  }
  const root = document.getElementById("root");
  root.innerHTML = html;
  setupMathFields(root, qEl => answer("numeric", qEl));
  if (!MOBILE || c.id !== SHOWN_ID) window.scrollTo(0, 0);  // the phone keeps its place when the card is redrawn
  SHOWN_ID = c.id;
  const field = root.querySelector("math-field");
  if (field && MOBILE) field.mathVirtualKeyboardPolicy = "auto";  // MathLive's math keyboard on touch
  if (field) field.focus();
}

let SHOWN_ID = null;  // the card last drawn
let FLAGS_OPEN = false;  // the phone's flag picker is showing

let CLOCK = null;  // the timer counting down a timed session

function progressHtml(c) {
  const s = c.session;
  clearInterval(CLOCK);
  if (!s) return "";
  const timed = s.limit === "time";
  const width = timed ? 100 * (1 - s.left / s.seconds) : s.total ? 100 * s.done / s.total : 0;
  const label = timed ? `<span id="clock">${clock(s.left)}</span> left` : `${s.done} / ${s.total}`;
  const combo = c.rewards && s.combo >= 2
    ? `<span class="combo" title="Cards in a row without a long pause; every 5 raise the XP multiplier">⚡ ${s.combo}${s.multiplier > 1 ? ` · ×${s.multiplier.toFixed(1)}` : ""}</span>` : "";
  if (timed) {
    const ends = Date.now() + s.left * 1000;
    CLOCK = setInterval(() => {
      const left = Math.max((ends - Date.now()) / 1000, 0);
      const el = document.getElementById("clock"), bar = document.querySelector(".prog .track i");
      if (!el) { clearInterval(CLOCK); return; }
      el.textContent = clock(left);
      bar.style.width = `${100 * (1 - left / s.seconds)}%`;
      if (!left) { el.parentElement.textContent = "Time's up: finish this card"; clearInterval(CLOCK); }
    }, 1000);
  }
  return `<div class="prog"><div class="track"><i style="width:${width.toFixed(1)}%"></i></div><span class="label">${label}</span>${combo}</div>`;
}

const clock = sec => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, "0")}`;

function answer(act, qEl, button) {
  if (!CARD || !bridge || qEl.classList.contains("busy")) return;
  const q = CARD.question;
  if (act === "reveal") { bridge.check(CARD.id, "{}"); return; }
  if (act === "show") {
    const area = qEl.querySelector("textarea");
    bridge.check(CARD.id, area ? JSON.stringify({ text: area.value.trim() }) : "{}");
    return;
  }
  const response = readResponse(q, qEl, act, button);
  if (!response) return;
  qEl.classList.add("busy");
  bridge.check(CARD.id, JSON.stringify(response));
}

// From the app: an answer it couldn't read; the input stays.
function inputError(cardId, error) {
  const q = CARD && CARD.id === cardId ? document.querySelector(".card .q") : null;
  if (!q) return;
  q.classList.remove("busy");
  const el = q.querySelector(".q-error");
  if (el) el.textContent = error;
}

document.addEventListener("click", ev => {
  const target = ev.target.closest("[data-act]");
  if (!target || target.disabled || !bridge) return;
  if (target.tagName === "A") ev.preventDefault();
  const act = target.dataset.act;
  if (act === "start") bridge.start(target.dataset.limit || "");
  else if (act === "stop") bridge.stop();
  else if (act === "twist") {
    ev.stopPropagation();
    const key = target.dataset.key;
    OPEN.has(key) ? OPEN.delete(key) : OPEN.add(key);
    bridge.refresh();
  }
  else if (act === "pick") { PICK = target.dataset.tab; if (LAST) showOverview(LAST); }
  else if (act === "deck") bridge.chooseDeck(+target.dataset.deck);
  else if (act === "book") bridge.chooseBook(+target.dataset.book);
  else if (act === "section") bridge.chooseSection(+target.dataset.book, target.dataset.tag);
  else if (act === "browse" || act === "stats" || act === "calc") bridge.open(act);
  else if (!CARD) return;
  else if (act === "rate") { FLAGS_OPEN = false; bridge.rate(CARD.id, +target.dataset.k); }
  else if (act === "flag") { FLAGS_OPEN = !FLAGS_OPEN; showCard(CARD); }
  else if (act === "setflag") { FLAGS_OPEN = false; bridge.act(CARD.id, `flag:${target.dataset.k}`); }
  else if (["source", "chat", "skip", "suspend", "delete", "edit", "bury"].includes(act)) { FLAGS_OPEN = false; bridge.act(CARD.id, act); }
  else answer(act, target.closest(".q"), target);
});

document.addEventListener("keydown", ev => {
  if (!bridge || ev.ctrlKey && ev.key !== "Enter" || ev.altKey || ev.metaKey) return;
  const typing = ev.target.matches && ev.target.matches("textarea, input, math-field");
  if (typing) {
    if (ev.key === "Enter" && ev.ctrlKey && ev.target.matches("textarea.free")) {
      ev.preventDefault();
      answer("show", ev.target.closest(".q"));
    } else if (ev.key === "Escape" && ev.target.matches("textarea.free")) {
      ev.target.blur();
    }
    return;
  }
  const go = () => ev.preventDefault();
  if (!CARD) {
    if (!document.querySelector("[data-act=start]")) return;
    if (ev.key === " " || ev.key === "Enter") { go(); bridge.start(""); }
    else if (ev.key === "5") { go(); bridge.start("cards"); }
    return;
  }
  if (CARD.previews && "1234".includes(ev.key) && ev.key.length === 1) { go(); bridge.rate(CARD.id, +ev.key); }
  else if (ev.key === " " || ev.key === "Enter") {
    if (CARD.previews) { go(); bridge.rate(CARD.id, CARD.suggested || 3); }
    else if (selfRated(CARD.question) && !CARD.answer) { go(); answer("show", document.querySelector(".card .q")); }
  }
});
</script>
</body>
</html>
