<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="quiz.css">
<script src="katex/katex.min.js"></script>
<script src="markdown-it.min.js"></script>
<script src="markdown.js"></script>
<script src="mathlive/mathlive.min.js"></script>
<script src="mathfield.js"></script>
<script src="quiz.js"></script>
<script src="confetti.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<style>
  /* Fallbacks; the app sets these from theme.py. */
  :root { --surface:#fbfaf8; --raised:#ffffff; --fg:#1f1e1c; --muted:#6b6862; --faint:#a19d95; --border:#dedad2;
          --hover:#ebe8e1; --accent:#b8562f; --accent-fg:#ffffff; --accent-soft:#f4e2d8; --code:#f1eee8; --scroll:#cfcac1;
          --user:#efece6; --error:#c0392b; --success:#3a8f5c; --warning:#b8860b; }
  html, body { margin:0; background:var(--surface); color:var(--fg); font:14.5px/1.6 system-ui, sans-serif; }
  ::selection { background:var(--accent-soft); }
  ::-webkit-scrollbar { width:11px; height:11px; }
  ::-webkit-scrollbar-thumb { background:var(--scroll); border-radius:3px; border:3px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background-color:var(--faint); }
  #root { max-width:680px; margin:0 auto; padding:6px 4px 28px; overflow-wrap:anywhere; }
  h1 { font-size:1.15em; margin:0 0 12px; }
  .stats { display:flex; gap:8px; margin:0 0 14px; }
  .stat { flex:1; background:var(--raised); border:1px solid var(--border); border-radius:10px; padding:8px 10px; }
  .stat .n { font-size:1.6em; font-weight:650; line-height:1.2; }
  .stat .l { font-size:12px; color:var(--muted); }
  .stat.due .n { color:var(--accent); } .stat.new .n { color:var(--success); }
  .start { display:block; width:100%; font:inherit; font-weight:600; padding:9px; border-radius:9px; cursor:pointer;
           border:1px solid var(--accent); background:var(--accent); color:var(--accent-fg); }
  .start:hover { filter:brightness(1.08); }
  .msg { color:var(--muted); text-align:center; margin:18px auto; line-height:1.5; }
  .msg strong { color:var(--fg); }
  .hint { color:var(--muted); font-size:12.5px; margin-top:18px; line-height:1.5; }
  .hint kbd, .keys kbd { font:inherit; font-size:11px; padding:0 4px; border:1px solid var(--border); border-radius:4px; background:var(--code); }
  .empty svg { display:block; margin:30px auto 12px; width:36px; height:36px; stroke:var(--faint); fill:none;
               stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
  .bar { display:flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); margin-bottom:8px; }
  .bar .grow { flex:1; }
  .bar a { color:var(--muted); text-decoration:none; padding:1px 7px; border-radius:5px; }
  .bar a:hover { color:var(--fg); background:var(--hover); }
  .bar .count { font-weight:600; }
  .bar .count .due { color:var(--accent); } .bar .count .new { color:var(--success); }
  .card { background:var(--raised); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .card .q { border-bottom:none; padding:12px 14px 14px; }
  .card .q-meta { flex-wrap:wrap; gap:4px 8px; }
  .card .q-meta .tag { color:var(--success); }
  .card .q-meta .book { color:var(--fg); }
  .card .q-meta .src { white-space:nowrap; }
  .keys { font-size:11.5px; color:var(--faint); margin-top:6px; text-align:center; }
  .decks { background:var(--raised); border:1px solid var(--border); border-radius:10px; margin:0 0 14px; padding:4px; }
  .deck { display:flex; align-items:center; gap:6px; padding:3px 8px; border-radius:6px; cursor:pointer; font-size:13.5px; }
  .deck:hover { background:var(--hover); }
  .deck.sel { background:var(--accent-soft); }
  .deck .tw { width:14px; flex:none; color:var(--muted); text-align:center; font-size:10px; }
  .deck .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .deck .n { width:44px; text-align:right; font-variant-numeric:tabular-nums; color:var(--faint); }
  .deck .n.due { color:var(--accent); } .deck .n.new { color:var(--success); }
  .deck .n.zero { color:var(--faint); opacity:0.5; }
  .deck-head { display:flex; gap:6px; padding:2px 8px 4px; font-size:11px; color:var(--muted); font-weight:600; }
  .deck-head .name { flex:1; } .deck-head .n { width:44px; text-align:right; }
  .links { display:flex; gap:12px; justify-content:center; margin-top:10px; font-size:12.5px; }
  .links a { color:var(--muted); text-decoration:none; } .links a:hover { color:var(--accent); }
  /* Rewards (gamify.py) */
  .player { display:flex; gap:8px; margin:0 0 10px; flex-wrap:wrap; }
  .player > div { background:var(--raised); border:1px solid var(--border); border-radius:10px; padding:8px 10px; }
  .player .l { font-size:12px; color:var(--muted); }
  .player .n { font-size:1.4em; font-weight:650; line-height:1.15; font-variant-numeric:tabular-nums; }
  .player .n small { font-size:0.6em; color:var(--muted); font-weight:500; }
  .lvl { flex:2 1 190px; }
  .lvl .top { display:flex; align-items:baseline; gap:8px; }
  .lvl .badge { font-weight:700; font-size:12px; color:var(--accent-fg); background:var(--accent); border-radius:6px; padding:1px 7px; }
  .lvl .title { font-weight:650; }
  .xpbar { height:7px; border-radius:4px; background:var(--hover); overflow:hidden; margin:7px 0 3px; }
  .xpbar i { display:block; height:100%; border-radius:4px; background:linear-gradient(90deg, var(--accent), var(--warning)); }
  .streak, .ring { flex:1 1 110px; display:flex; align-items:center; gap:9px; }
  .streak .flame { font-size:26px; line-height:1; }
  .streak.off .flame { filter:grayscale(1); opacity:0.45; }
  .ring svg { width:42px; height:42px; flex:none; transform:rotate(-90deg); }
  .ring circle { fill:none; stroke-width:5; }
  .ring .track { stroke:var(--hover); }
  .ring .fill { stroke:var(--success); stroke-linecap:round; transition:stroke-dashoffset 0.6s; }
  .nudge { font-size:13px; color:var(--muted); background:var(--accent-soft); border-radius:8px; padding:6px 10px; margin:0 0 12px; }
  .quick { display:flex; gap:8px; margin-top:8px; }
  .quick button { flex:1; font:inherit; font-size:13.5px; padding:6px; border-radius:9px; cursor:pointer;
                  border:1px solid var(--border); background:var(--raised); color:var(--fg); }
  .quick button:hover { border-color:var(--accent); color:var(--accent); }
  .box { background:var(--raised); border:1px solid var(--border); border-radius:10px; padding:8px 10px; margin-top:14px; }
  .box > .head, details.box > summary { font-size:12px; color:var(--muted); font-weight:600; }
  details.box > summary { cursor:pointer; }
  .heat { overflow-x:auto; margin-top:6px; }
  .heat svg { display:block; }
  .ach-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:4px; margin-top:8px; }
  .ach { display:flex; gap:8px; align-items:center; padding:4px 6px; border-radius:7px; font-size:12.5px; line-height:1.3; }
  .ach .i { font-size:20px; flex:none; }
  .ach .d { color:var(--muted); font-size:11.5px; }
  .ach.locked { opacity:0.45; } .ach.locked .i { filter:grayscale(1); }
  .summary { background:var(--raised); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin:0 0 14px; text-align:center; }
  .summary h2 { font-size:1.2em; margin:0 0 10px; }
  .summary .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(90px, 1fr)); gap:8px; }
  .summary .n { font-size:1.35em; font-weight:650; font-variant-numeric:tabular-nums; }
  .summary .l { font-size:12px; color:var(--muted); }
  .prog { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin:0 0 8px; }
  .prog .track { flex:1; height:6px; border-radius:3px; background:var(--hover); overflow:hidden; }
  .prog .track i { display:block; height:100%; border-radius:3px; background:var(--accent); transition:width 0.4s; }
  .prog .label { font-variant-numeric:tabular-nums; }
  .combo { font-weight:700; color:var(--warning); display:inline-block; white-space:nowrap; }
  .combo.pulse { animation:pulse 0.5s; }
  #toasts { position:fixed; top:10px; right:10px; z-index:60; display:flex; flex-direction:column; gap:6px; pointer-events:none; }
  .toast { display:flex; gap:9px; align-items:center; max-width:270px; font-size:13px; line-height:1.35; background:var(--raised);
           border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:9px; padding:7px 12px;
           box-shadow:0 4px 16px rgba(0,0,0,0.18); animation:toast-in 0.35s ease-out; }
  .toast .i { font-size:22px; }
  .toast .d { color:var(--muted); font-size:12px; }
  .toast.out { animation:toast-out 0.4s forwards; }
  .float { position:fixed; left:50%; top:46px; z-index:55; pointer-events:none; font-weight:700; font-size:15px;
           color:var(--accent); animation:float-up 1.2s ease-out forwards; }
  @keyframes float-up { from { opacity:1; transform:translate(-50%, 0); } to { opacity:0; transform:translate(-50%, -44px); } }
  @keyframes toast-in { from { opacity:0; transform:translateX(30px); } to { opacity:1; transform:none; } }
  @keyframes toast-out { to { opacity:0; transform:translateX(30px); } }
  @keyframes pulse { 50% { transform:scale(1.35); } }
  @media (prefers-reduced-motion: reduce) { .toast, .float, .combo.pulse { animation:none; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
// The app picks the cards and schedules them (srs.py); this page shows the overview or one card,
// and sends answers, ratings and actions back through the web channel.
let bridge = null;
new QWebChannel(qt.webChannelTransport, channel => { bridge = channel.objects.review; });

const CARDS_ICON = `<svg viewBox="0 0 24 24"><rect width="14" height="16" x="7" y="5" rx="2"/><path d="M4 16V5a2 2 0 0 1 2-2h9"/></svg>`;
let CARD = null;  // the card on display, as the app sent it; null on the overview

function setTheme(colors, dark) {
  const root = document.documentElement;
  root.dataset.theme = dark ? "dark" : "light";
  for (const [k, v] of Object.entries(colors)) root.style.setProperty(`--${k.replace(/_/g, "-")}`, v);
}

const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const OPEN = new Set();  // rows expanded in the overview's lists: "d<deck id>", "b<book id>", "s<section tag>"
const num = (n, cls) => `<span class="n ${cls}${n ? "" : " zero"}">${n}</span>`;
const twist = (key, has) => `<span class="tw" data-act="twist" data-key="${esc(key)}">${has ? (OPEN.has(key) ? "▾" : "▸") : ""}</span>`;

// Every deck, with its own and its subdecks' counts; clicking one picks what to review.
function decksHtml(o) {
  const byParent = {};
  for (const d of o.decks) (byParent[d.parent ?? 0] ||= []).push(d);
  const row = (d, depth) => {
    const kids = byParent[d.id] || [];
    let html = `<div class="deck${o.deck === d.id ? " sel" : ""}" data-act="deck" data-deck="${d.id}" title="${esc(d.path)}"`
      + ` style="padding-left:${8 + depth * 16}px">${twist(`d${d.id}`, kids.length)}`
      + `<span class="name">${esc(d.name)}</span>${num(d.due, "due")}${num(d.new, "new")}</div>`;
    if (OPEN.has(`d${d.id}`)) for (const k of kids) html += row(k, depth + 1);
    return html;
  };
  return `<div class="decks"><div class="deck-head"><span class="tw"></span><span class="name">Deck</span><span class="n">Due</span><span class="n">New</span></div>`
    + `<div class="deck${o.deck === null && o.book === null ? " sel" : ""}" data-act="deck" data-deck="0"><span class="tw"></span><span class="name">All decks</span>`
    + `${num(o.all_due, "due")}${num(o.all_new, "new")}</div>`
    + (byParent[0] || []).map(d => row(d, 0)).join("") + `</div>`;
}

// A book's sections (srs.sections) as rows under it; clicking one reviews just that section.
function sectionRows(sections, bookId, selected, depth) {
  const byParent = {};
  for (const s of sections) (byParent[s.parent ?? ""] ||= []).push(s);
  const row = (s, depth) => {
    const kids = byParent[s.tag] || [];
    let html = `<div class="deck${selected === s.tag ? " sel" : ""}" data-act="section" data-book="${bookId}" data-tag="${esc(s.tag)}"`
      + ` title="${esc(s.tag.split("::").slice(1).join(" › ").replace(/_/g, " "))}" style="padding-left:${8 + depth * 16}px">`
      + `${twist(`s${s.tag}`, kids.length)}<span class="name">${esc(s.name)}</span>${num(s.due, "due")}${num(s.new, "new")}</div>`;
    if (OPEN.has(`s${s.tag}`)) for (const k of kids) html += row(k, depth + 1);
    return html;
  };
  return (byParent[""] || []).map(s => row(s, depth)).join("");
}

// Every book with cards (all_books), each opening onto its sections.
function booksHtml(o) {
  return `<div class="decks"><div class="deck-head"><span class="tw"></span><span class="name">Book</span><span class="n">Due</span><span class="n">New</span></div>`
    + o.books.map(b => {
      const key = `b${b.id}`;
      let html = `<div class="deck${o.book === b.id && !o.section ? " sel" : ""}" data-act="book" data-book="${b.id}" title="${esc(b.title)}">`
        + `${twist(key, b.sections.length)}<span class="name">${esc(b.title)}</span>${num(b.due, "due")}${num(b.new, "new")}</div>`;
      if (OPEN.has(key)) html += sectionRows(b.sections, b.id, o.book === b.id ? o.section : null, 1);
      return html;
    }).join("") + `</div>`;
}

// The open book's sections, to review just one.
function sectionsHtml(o) {
  return `<div class="decks"><div class="deck-head"><span class="tw"></span><span class="name">Section</span><span class="n">Due</span><span class="n">New</span></div>`
    + `<div class="deck${o.section ? "" : " sel"}" data-act="section" data-book="0" data-tag=""><span class="tw"></span><span class="name">Whole book</span>`
    + `${num(o.whole_due, "due")}${num(o.whole_new, "new")}</div>`
    + sectionRows(o.sections, 0, o.section, 0) + `</div>`;
}

function showOverview(o) {
  CARD = null;
  const root = document.getElementById("root");
  if (o.disabled) { root.innerHTML = ""; return; }
  const how = `Every question in a quiz Claude writes becomes a review card. Choose <em>Quiz me</em>
    (<kbd>Ctrl+Shift+Q</kbd>) on a selection or the section you're reading, or under one of
    Claude's replies.`;
  if (!o.total) {
    root.innerHTML = `<div class="empty">${CARDS_ICON}<div class="msg">No review cards ${o.all ? "yet" : "for this book yet"}.</div></div>`
      + `<div class="hint">${how}</div>`;
    return;
  }
  const g = o.game;
  let html = `<h1>${o.title ? esc(o.title) : o.all ? "Review all decks" : "Review"}</h1>`;
  if (o.summary) html += summaryHtml(o.summary, !!g);
  if (g) html += playerHtml(g);
  if (o.all && (o.decks?.length || o.books?.length)) html += decksHtml(o);
  if (o.all && o.books && o.books.length) html += booksHtml(o);
  if (!o.all && o.sections && o.sections.length) html += sectionsHtml(o);
  html += `<div class="stats">`
    + `<div class="stat due"><div class="n">${o.due}</div><div class="l">due</div></div>`
    + `<div class="stat new"><div class="n">${o.new}</div><div class="l">new today${o.new_total > o.new ? ` · ${o.new_total} waiting` : ""}</div></div>`
    + `<div class="stat"><div class="n">${o.total}</div><div class="l">cards${o.suspended ? ` · ${o.suspended} suspended` : ""}</div></div></div>`;
  if (o.reviewed && !o.summary) html += `<div class="msg"><strong>${plural(o.reviewed, "card")} reviewed.</strong></div>`;
  const more = o.reviewed ? " more" : "";
  if (o.ready) html += `<button class="start" data-act="start">${o.reviewed ? "Keep going" : "Start review"}</button>`
    + `<div class="quick"><button data-act="start" data-limit="cards" title="A short session: just ${o.quick.cards} cards">Just ${o.quick.cards}${more} cards</button>`
    + `<button data-act="start" data-limit="time" title="A short session: as many cards as fit in ${o.quick.minutes} minutes">${o.quick.minutes}${more} minutes</button></div>`
    + `<div class="keys"><kbd>Space</kbd> to start · <kbd>5</kbd> for ${o.quick.cards} cards</div>`;
  else html += `<div class="msg">All caught up${o.next ? ` — the next card is due ${esc(o.next)}` : ""}.`
    + (o.new_total > o.new ? `<br>Today's ${o.new_per_day} new cards are done; more tomorrow.` : "") + `</div>`;
  html += `<div class="links"><a href="#" data-act="browse">Browse cards</a><a href="#" data-act="stats">Statistics</a></div>`;
  if (g) html += extrasHtml(g);
  root.innerHTML = html + `<div class="hint">${how}</div>`;
  if (g) heatmap(document.getElementById("heat"), g.heat);
}

// -- rewards (gamify.py) ------------------------------------------------------------------
let ACH_OPEN = false;  // the achievements list is expanded
const comma = n => n.toLocaleString();

function playerHtml(g) {
  const r = 17, C = 2 * Math.PI * r, frac = Math.min(g.today / g.goal, 1);
  const met = g.goal_met;
  let html = `<div class="player">`
    + `<div class="lvl" title="${comma(g.xp)} XP in all: 10 a card, 15 a new one, times your combo multiplier">`
    + `<div class="top"><span class="badge">Lv ${g.level}</span><span class="title">${esc(g.title)}</span></div>`
    + `<div class="xpbar"><i style="width:${(100 * g.into / g.need).toFixed(1)}%"></i></div>`
    + `<div class="l">${comma(g.into)} / ${comma(g.need)} XP to level ${g.level + 1}</div></div>`
    + `<div class="streak${g.streak ? "" : " off"}" title="Days in a row with at least one review. A streak freeze `
    + `covers a missed day; you earn one every ${g.freeze_every} days of streak (at most 2).">`
    + `<span class="flame">🔥</span><div><div class="n">${g.streak}</div>`
    + `<div class="l">day streak${g.freezes ? ` · ${"❄️".repeat(g.freezes)}` : ""}</div></div></div>`
    + `<div class="ring" title="Daily goal: ${g.goal} reviews (change it under Settings › Review settings). Reviewing everything due meets it too.">`
    + `<svg viewBox="0 0 42 42"><circle class="track" cx="21" cy="21" r="${r}"/>`
    + `<circle class="fill" cx="21" cy="21" r="${r}" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - (met ? 1 : frac))).toFixed(2)}"/></svg>`
    + `<div><div class="n">${g.today}<small> / ${g.goal}</small></div><div class="l">${met ? "goal met ✓" : "today's goal"}</div></div></div>`
    + `</div>`;
  if (g.at_risk) html += `<div class="nudge">Keep your ${g.streak}-day streak going: even one card today counts.</div>`;
  else if (g.lapsed) html += `<div class="nudge">A fresh start: one card begins a new streak.</div>`;
  return html;
}

function summaryHtml(s, game) {
  const head = s.caught_up ? "All caught up! 🎉" : s.quick ? "Quick session done! 🍪" : "Session summary";
  const mins = `${Math.floor(s.seconds / 60)}:${String(s.seconds % 60).padStart(2, "0")}`;
  const stat = (n, l) => `<div><div class="n">${n}</div><div class="l">${l}</div></div>`;
  let cells = stat(s.reviewed, s.reviewed === 1 ? "card" : "cards")
    + stat(`${Math.round(100 * s.passed / s.reviewed)}%`, "recalled")
    + stat(mins, "time");
  if (game) cells += stat(`+${comma(s.xp)}`, "XP") + stat(s.best, "best combo");
  if (s.matured) cells += stat(s.matured, s.matured === 1 ? "card matured" : "cards matured");
  if (s.stability) cells += stat(`+${comma(s.stability)}d`, "memory stability");
  return `<div class="summary"><h2>${head}</h2><div class="grid">${cells}</div></div>`;
}

function extrasHtml(g) {
  const got = g.achievements.filter(a => a.unlocked).length;
  const list = g.achievements.map(a => `<div class="ach${a.unlocked ? "" : " locked"}" title="${esc(a.desc)}">`
    + `<span class="i">${a.icon}</span><div><div>${esc(a.name)}</div><div class="d">${esc(a.desc)}</div></div></div>`).join("");
  return `<div class="box"><div class="head">Recent weeks</div><div class="heat" id="heat"></div></div>`
    + `<details class="box" id="ach"${ACH_OPEN ? " open" : ""}><summary>Achievements · ${got} of ${g.achievements.length}</summary>`
    + `<div class="ach-grid">${list}</div></details>`;
}

const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

// Reviews per day over the recent weeks, a column a week; days a streak freeze covered show a snowflake.
function heatmap(el, heat) {
  const counts = Object.fromEntries(heat.days.map(d => [d.date, d.count]));
  const frozen = new Set(heat.frozen);
  const max = Math.max(1, ...heat.days.map(d => d.count));
  const start = new Date(heat.start + "T12:00"), end = new Date(heat.end + "T12:00");
  const first = new Date(start); first.setDate(first.getDate() - first.getDay());
  const size = 12, gap = 3, top = 14, left = 26;
  let cells = "", months = "", x = 0, lastMonth = -1;
  for (let week = new Date(first); week <= end; week.setDate(week.getDate() + 7), x++) {
    if (week.getMonth() !== lastMonth) {
      lastMonth = week.getMonth();
      months += `<text x="${left + x * (size + gap)}" y="10" font-size="10" style="fill:var(--muted)">${week.toLocaleDateString(undefined, { month: "short" })}</text>`;
    }
    for (let d = 0; d < 7; d++) {
      const day = new Date(week); day.setDate(day.getDate() + d);
      if (day < start || day > end) continue;
      const iso = isoDay(day), n = counts[iso] || 0;
      const px = left + x * (size + gap), py = top + d * (size + gap);
      const label = day.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
      if (frozen.has(iso)) {
        cells += `<text x="${px + size / 2}" y="${py + 10}" font-size="11" text-anchor="middle"><title>${esc(label)}: streak freeze</title>❄</text>`;
        continue;
      }
      const opacity = n ? (0.3 + 0.7 * Math.sqrt(n / max)).toFixed(2) : 0.55;
      const style = `fill:var(${n ? "--accent" : "--border"})${iso === heat.end ? ";stroke:var(--muted)" : ""}`;
      cells += `<rect x="${px}" y="${py}" width="${size}" height="${size}" rx="2" style="${style}"`
        + ` fill-opacity="${opacity}"><title>${esc(label)}: ${plural(n, "review")}</title></rect>`;
    }
  }
  const days = ["", "Mon", "", "Wed", "", "Fri", ""].map((l, d) => l ? `<text x="0" y="${top + d * (size + gap) + 10}" font-size="10" style="fill:var(--muted)">${l}</text>` : "").join("");
  el.innerHTML = `<svg width="${left + x * (size + gap)}" height="${top + 7 * (size + gap)}">${months}${days}${cells}</svg>`;
}

document.addEventListener("toggle", ev => { if (ev.target.id === "ach") ACH_OPEN = ev.target.open; }, true);

function toast(icon, title, detail) {
  let box = document.getElementById("toasts");
  if (!box) { box = document.createElement("div"); box.id = "toasts"; document.body.appendChild(box); }
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span class="i">${icon}</span><div><div><strong>${esc(title)}</strong></div>${detail ? `<div class="d">${esc(detail)}</div>` : ""}</div>`;
  box.appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 450); }, 3800);
}

function floatText(text) {
  const el = document.createElement("div");
  el.className = "float";
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1300);
}

// From the app: what the last review or session earned.
function celebrate(events) {
  for (const e of events) {
    if (e.kind === "xp") floatText(`+${e.xp} XP`);
    else if (e.kind === "combo") {
      const el = document.querySelector(".combo");
      if (el) { el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse"); }
      confetti({ count: 25, spread: 400 });
    }
    else if (e.kind === "milestone") { confetti({ count: 70 }); toast("🎉", `${e.n} cards this session!`, "Keep it rolling."); }
    else if (e.kind === "level") { confetti({ count: 160, spread: 1000 }); toast("⭐", `Level ${e.level}!`, e.title); }
    else if (e.kind === "goal") { confetti({ count: 120 }); toast("🎯", "Daily goal reached!", "Anything more is a bonus."); }
    else if (e.kind === "freeze") toast("❄️", "Streak freeze earned", `You have ${e.freezes}. Each one covers a missed day.`);
    else if (e.kind === "achievement") { confetti({ count: 80 }); toast(e.icon, `Achievement: ${e.name}`, e.desc); }
    else if (e.kind === "welcome") toast("🤝", "Welcome back!", "Every card counts. Start small.");
    else if (e.kind === "done") {
      if (e.caught_up) confetti({ count: 240, spread: 1400 });
      else if (e.quick) confetti({ count: 110 });
    }
  }
}

function showCard(c) {
  CARD = c;
  const q = c.question, a = c.answer;
  const meta = [
    c.new ? `<span class="tag">New</span>` : "",
    c.varied ? `<span class="tag" title="Claude wrote this version with new numbers after your last review">New numbers</span>` : "",
    c.book ? `<span class="book">${esc(c.book)}</span>` : "",
    `<span title="${esc(c.deck)}">${esc(c.title || c.deck.split("::").pop())}</span>`,
    c.page !== null ? `<a class="src" href="#" data-act="source" title="Show this page in the book">p. ${c.page + 1}</a>` : "",
    c.chat ? `<a class="src" href="#" data-act="chat" title="Open the chat the quiz is in">Open chat</a>` : "",
  ].filter(Boolean).join("<span>·</span>");
  const freeActions = `<div class="submit-row"><span class="grow">Ctrl+Enter to grade</span>`
    + `<button class="qbtn quiet" data-act="show">Show answer</button><button class="qbtn" data-act="free">Grade with Claude</button></div>`;
  let html = `<div class="bar"><a href="#" data-act="stop" title="Back to the overview">← Overview</a><span class="grow"></span>`
    + `<span class="count"><span class="due">${c.remaining.due}</span> due · <span class="new">${c.remaining.new}</span> new</span>`
    + `<a href="#" data-act="skip" title="Show another card first">Skip</a>`
    + `<a href="#" data-act="edit" title="Open this card in the browser to edit it">Edit</a>`
    + `<a href="#" data-act="suspend" title="Leave this card out of review (the quiz's “In review” toggle brings it back)">Suspend</a>`
    + `<a href="#" data-act="delete" title="Delete this card and its history">Delete</a></div>`;
  html += progressHtml(c);
  html += `<div class="card">${questionHtml(q, a || undefined, { meta, freeActions, openAnswer: true })}`;
  html += `</div>`;
  if (c.previews) {
    html += `<div class="submit-row" style="margin-top:12px">How well did you know it?</div>${ratingRow(c.previews, c.suggested)}`
      + `<div class="keys"><kbd>1</kbd>–<kbd>4</kbd> to rate · <kbd>Space</kbd> for ${RATING_LABELS[c.suggested || 3]}</div>`;
  } else if (SELF_RATED.includes(q.type) && !a) {
    html += `<div class="keys"><kbd>Space</kbd> to show the answer</div>`;
  }
  const root = document.getElementById("root");
  root.innerHTML = html;
  setupMathFields(root, qEl => answer("numeric", qEl));
  window.scrollTo(0, 0);
  const field = root.querySelector("math-field, textarea.free");
  if (field) field.focus();
}

let CLOCK = null;  // the timer counting down a timed session

function progressHtml(c) {
  const s = c.session;
  clearInterval(CLOCK);
  if (!s) return "";
  const timed = s.limit === "time";
  const width = timed ? 100 * (1 - s.left / s.seconds) : s.total ? 100 * s.done / s.total : 0;
  const label = timed ? `<span id="clock">${clock(s.left)}</span> left` : `${s.done} / ${s.total}`;
  const combo = c.rewards && s.combo >= 2
    ? `<span class="combo" title="Cards in a row without a long pause; every 5 raise the XP multiplier">⚡ ${s.combo}${s.multiplier > 1 ? ` · ×${s.multiplier.toFixed(1)}` : ""}</span>` : "";
  if (timed) {
    const ends = Date.now() + s.left * 1000;
    CLOCK = setInterval(() => {
      const left = Math.max((ends - Date.now()) / 1000, 0);
      const el = document.getElementById("clock"), bar = document.querySelector(".prog .track i");
      if (!el) { clearInterval(CLOCK); return; }
      el.textContent = clock(left);
      bar.style.width = `${100 * (1 - left / s.seconds)}%`;
      if (!left) { el.parentElement.textContent = "Time's up: finish this card"; clearInterval(CLOCK); }
    }, 1000);
  }
  return `<div class="prog"><div class="track"><i style="width:${width.toFixed(1)}%"></i></div><span class="label">${label}</span>${combo}</div>`;
}

const clock = sec => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, "0")}`;

function answer(act, qEl, button) {
  if (!CARD || !bridge || qEl.classList.contains("busy")) return;
  const q = CARD.question;
  if (act === "reveal") { bridge.check(CARD.id, "{}"); return; }
  if (act === "show") {
    const area = qEl.querySelector("textarea");
    bridge.check(CARD.id, JSON.stringify({ text: area ? area.value.trim() : "" }));
    return;
  }
  if (act === "free" || act === "regrade") {
    const text = act === "regrade" ? (CARD.answer && CARD.answer.response.text) || "" : qEl.querySelector("textarea").value.trim();
    if (text) bridge.claude(CARD.id, text);
    return;
  }
  const response = readResponse(q, qEl, act, button);
  if (!response) return;
  qEl.classList.add("busy");
  bridge.check(CARD.id, JSON.stringify(response));
}

// From the app: an answer it couldn't read; the input stays.
function inputError(cardId, error) {
  const q = CARD && CARD.id === cardId ? document.querySelector(".card .q") : null;
  if (!q) return;
  q.classList.remove("busy");
  const el = q.querySelector(".q-error");
  if (el) el.textContent = error;
}

document.addEventListener("click", ev => {
  const target = ev.target.closest("[data-act]");
  if (!target || target.disabled || !bridge) return;
  if (target.tagName === "A") ev.preventDefault();
  const act = target.dataset.act;
  if (act === "start") bridge.start(target.dataset.limit || "");
  else if (act === "stop") bridge.stop();
  else if (act === "twist") {
    ev.stopPropagation();
    const key = target.dataset.key;
    OPEN.has(key) ? OPEN.delete(key) : OPEN.add(key);
    bridge.refresh();
  }
  else if (act === "deck") bridge.chooseDeck(+target.dataset.deck);
  else if (act === "book") bridge.chooseBook(+target.dataset.book);
  else if (act === "section") bridge.chooseSection(+target.dataset.book, target.dataset.tag);
  else if (act === "browse" || act === "stats") bridge.open(act);
  else if (!CARD) return;
  else if (act === "rate") bridge.rate(CARD.id, +target.dataset.k);
  else if (["source", "chat", "skip", "suspend", "delete", "edit"].includes(act)) bridge.act(CARD.id, act);
  else answer(act, target.closest(".q"), target);
});

document.addEventListener("keydown", ev => {
  if (!bridge || ev.ctrlKey && ev.key !== "Enter" || ev.altKey || ev.metaKey) return;
  const typing = ev.target.matches && ev.target.matches("textarea, input, math-field");
  if (typing) {
    if (ev.key === "Enter" && ev.ctrlKey && ev.target.matches("textarea.free")) {
      ev.preventDefault();
      answer("free", ev.target.closest(".q"));
    }
    return;
  }
  const go = () => ev.preventDefault();
  if (!CARD) {
    if (!document.querySelector("[data-act=start]")) return;
    if (ev.key === " " || ev.key === "Enter") { go(); bridge.start(""); }
    else if (ev.key === "5") { go(); bridge.start("cards"); }
    return;
  }
  if (CARD.previews && "1234".includes(ev.key) && ev.key.length === 1) { go(); bridge.rate(CARD.id, +ev.key); }
  else if (ev.key === " " || ev.key === "Enter") {
    if (CARD.previews) { go(); bridge.rate(CARD.id, CARD.suggested || 3); }
    else if (SELF_RATED.includes(CARD.question.type) && !CARD.answer) { go(); bridge.check(CARD.id, "{}"); }
  }
});
</script>
