[workspace]
name = "study-reader-android"
description = "Android companion to Study Reader: review cards on the phone, synced through a Syncthing folder"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# Bootstrap/fallback runner only; builds use ./gradlew (the wrapper pins 8.11.1).
gradle = ">=8.11"
openjdk = "21.*"

[activation.env]
ANDROID_HOME = "/home/russell/Android/Sdk"

[tasks]
build = { cmd = "./gradlew assembleRelease", description = "Assemble the release APK" }
build-debug = { cmd = "./gradlew assembleDebug", description = "Assemble the debug APK" }
install = { cmd = "./gradlew installRelease", description = "Build and install the release APK on the connected adb device" }
install-debug = { cmd = "./gradlew installDebug", description = "Build and install the debug APK" }
run = { cmd = "adb shell am start -n dev.russell.studyreader/.MainActivity", depends-on = ["install"], description = "Install the release APK and launch it" }
test = { cmd = "./gradlew :core:test", description = "JVM tests of the shared logic (FSRS, grading, queue, rewards, sync)" }
lint = { cmd = "./gradlew lintDebug", description = "Android lint" }
clean = { cmd = "./gradlew clean", description = "Delete build outputs" }
logs = { cmd = "adb logcat --pid=$(adb shell pidof -s dev.russell.studyreader)", description = "Logcat for the running app" }
